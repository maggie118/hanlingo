<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  
  <!-- ===== Title ===== -->
  <title>HanLingo · 学习进度</title>
  
  <!-- ===== SEO Meta ===== -->
  <meta name="description" content="追踪您在 HSK, YCT, BCT, MCT 等学习路径中的中文学习进度。">
  <meta name="author" content="HanLingo">
  <meta name="robots" content="index, follow">
  
  <!-- ===== Open Graph / Facebook ===== -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hanlingo.app/progress.html">
  <meta property="og:title" content="HanLingo · 学习进度">
  <meta property="og:image" content="https://hanlingo.app/icon-512.png">
  <meta property="og:site_name" content="HanLingo">
  
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" href="/favicon.ico">
  
  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ===== 全局变量 ===== */
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --blue: #007AFF;
      --blue-dark: #0066CC;
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px;
      --radius-full: 60px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.5; padding: 0 0 80px 0; min-height: 100vh; }
    
    .app-container { max-width: 480px; margin: 0 auto; background: var(--surface); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.02); }
    
    /* ===== 状态栏 ===== */
    .status-bar { background: var(--surface); padding: 8px 20px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    
    /* ===== 头部 ===== */
    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
    .logo-area:hover { opacity: 0.8; }
    .logo-icon { background: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 700; }
    .logo-text { font-weight: 700; font-size: 1rem; }
    .logo-text .han { color: var(--text); }
    .logo-text .lingo { color: var(--blue); }
    .header-actions { display: flex; gap: 14px; color: var(--text-secondary); font-size: 1rem; align-items: center; }
    .header-actions i { cursor: pointer; transition: 0.2s; }
    .header-actions i:hover { color: var(--blue); }

    /* ===== 内容区 ===== */
    .progress-container { padding: 16px 20px 10px 20px; }

    /* 统计网格 */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-box { background: var(--bg); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
    .stat-box .num { font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .stat-box .num.blue { color: var(--blue); }
    .stat-box .num.green { color: var(--green); }
    .stat-box .label { font-size: 0.5rem; color: var(--text-secondary); margin-top: 2px; }

    /* 进度条卡片 */
    .progress-section { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; border: 1px solid var(--border); margin-bottom: 14px; }
    .progress-section .title { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .progress-section .title i { color: var(--blue); }
    .progress-section .bar-wrap { display: flex; align-items: center; gap: 12px; }
    .progress-section .bar-track { flex: 1; height: 4px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .progress-section .bar-track .fill { height: 100%; background: var(--blue); border-radius: 20px; transition: width 0.8s ease; }
    .progress-section .bar-label { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); min-width: 44px; text-align: right; }

    /* 等级网格 */
    .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 4px 0; }
    .level-box { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 4px; text-align: center; border: 1px solid transparent; transition: 0.2s; position: relative; cursor: pointer; }
    .level-box.unlocked { border-color: var(--blue); background: #F0F7FF; }
    .level-box.completed { border-color: var(--green); background: #E8F8ED; }
    .level-box.locked { opacity: 0.5; }
    .level-box .level-num { font-size: 0.6rem; font-weight: 700; color: var(--text); }
    .level-box .level-icon { font-size: 0.8rem; display: block; margin: 2px 0; }
    .level-box .level-label { font-size: 0.45rem; color: var(--text-secondary); }
    .level-box .check { position: absolute; top: -4px; right: -4px; background: var(--green); color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 8px; display: flex; align-items: center; justify-content: center; }

    /* 图表 */
    .chart-section { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; border: 1px solid var(--border); margin-bottom: 14px; }
    .chart-section .title { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-section .title i { color: var(--blue); }
    .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 80px; gap: 4px; padding-top: 4px; }
    .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
    .chart-bar { width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; transition: height 0.8s ease; min-height: 2px; background: var(--border); }
    .chart-bar.done { background: var(--blue); }
    .chart-bar-label { font-size: 0.4rem; color: var(--text-secondary); margin-top: 4px; text-align: center; }

    /* 错题列表 */
    .wrong-section { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); margin-bottom: 14px; }
    .wrong-section .title { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .wrong-section .title i { color: var(--orange); }
    .wrong-section .title .badge { font-size: 0.45rem; font-weight: 600; background: #FFF0EF; color: var(--red); padding: 0px 8px; border-radius: 30px; }
    .wrong-list { max-height: 120px; overflow-y: auto; }
    .wrong-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 0.5px solid var(--border); font-size: 0.6rem; }
    .wrong-item:last-child { border-bottom: none; }
    .wrong-item .chinese { font-weight: 500; color: var(--text); }
    .wrong-item .trans { color: var(--text-secondary); }
    .wrong-item .count { font-size: 0.5rem; color: var(--red); font-weight: 600; }
    .wrong-empty { font-size: 0.6rem; color: var(--text-secondary); text-align: center; padding: 8px 0; }

    /* 学习提示 */
    .tip-box { background: var(--bg); border-radius: var(--radius); padding: 12px 14px; border: 1px solid var(--border); margin-bottom: 10px; }
    .tip-box .content { display: flex; align-items: center; gap: 8px; }
    .tip-box .icon { font-size: 1.1rem; }
    .tip-box .info .title { font-size: 0.65rem; font-weight: 600; color: var(--text); }
    .tip-box .info .desc { font-size: 0.55rem; color: var(--text-secondary); }

    /* ===== 底部导航 ===== */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px 0; max-width: 480px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 0.55rem; font-weight: 500; gap: 1px; cursor: pointer; padding: 4px 12px; border-radius: 20px; transition: 0.1s; }
    .nav-item i { font-size: 1.3rem; color: var(--text-secondary); }
    .nav-item.active i { color: var(--blue); }
    .nav-item.active { color: var(--text); }
    .nav-item:active { background: var(--bg); }

    /* ===== Toast ===== */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(29,29,31,0.9); backdrop-filter: blur(12px); color: white; padding: 12px 24px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s ease; z-index: 200; max-width: 90%; text-align: center; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast i { margin-right: 8px; color: #5AC8FA; }

    @media (max-width: 400px) {
      .stats-grid { gap: 4px; }
      .stat-box { padding: 8px 4px; }
      .stat-box .num { font-size: 1rem; }
      .level-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>HanLingo</span>
      <span>学习进度</span>
    </div>

    <header class="header">
      <div class="logo-area" id="goHomeBtn">
        <div class="logo-icon">HL</div>
        <div class="logo-text">
          <span class="han">Han</span><span class="lingo">Lingo</span>
        </div>
      </div>
      <div class="header-actions">
        <i class="far fa-bell"></i>
        <i class="far fa-user-circle"></i>
      </div>
    </header>

    <div class="progress-container">
      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="num blue" id="totalLearned">0</div>
          <div class="label">✅ 已学</div>
        </div>
        <div class="stat-box">
          <div class="num" id="totalSentences">0</div>
          <div class="label">📚 总数</div>
        </div>
        <div class="stat-box">
          <div class="num green" id="progressPercent">0%</div>
          <div class="label">📈 进度</div>
        </div>
      </div>

      <!-- 总进度 -->
      <div class="progress-section">
        <div class="title"><i class="fas fa-chart-line"></i> 总进度</div>
        <div class="bar-wrap">
          <div class="bar-track"><div class="fill" id="overallFill" style="width:0%;"></div></div>
          <span class="bar-label" id="overallLabel">0%</span>
        </div>
      </div>

      <!-- 等级概览 -->
      <div class="progress-section">
        <div class="title"><i class="fas fa-layer-group"></i> 等级概览</div>
        <div class="level-grid" id="levelGrid"></div>
      </div>

      <!-- 学习活跃度 -->
      <div class="chart-section">
        <div class="title"><i class="fas fa-chart-bar"></i> 等级完成度</div>
        <div class="chart-bars" id="chartBars"></div>
      </div>

      <!-- 待复习列表 -->
      <div class="wrong-section" id="wrongSection">
        <div class="title">
          <i class="fas fa-times-circle"></i> 待复习
          <span class="badge" id="wrongBadge">0</span>
        </div>
        <div class="wrong-list" id="wrongList">
          <div class="wrong-empty">🎉 没有错题！继续保持！</div>
        </div>
      </div>

      <!-- 学习小贴士 -->
      <div class="tip-box">
        <div class="content">
          <span class="icon">💡</span>
          <div class="info">
            <div class="title">学习小贴士</div>
            <div class="desc" id="tipText">复习错题是提升最快的方式！</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>主页</span></div>
      <div class="nav-item" data-page="learn"><i class="fas fa-book-open"></i><span>课程</span></div>
      <div class="nav-item" data-page="review"><i class="fas fa-sync-alt"></i><span>复习</span></div>
      <div class="nav-item active" data-page="progress"><i class="fas fa-chart-simple"></i><span>进度</span></div>
      <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>个人</span></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="data/sentences.js"></script>
  <script>
    // ============ DATA ============
    var allSentences = (typeof HSK1_SENTENCES !== 'undefined') ? HSK1_SENTENCES : [];
    var learnedIds = JSON.parse(localStorage.getItem('juli_learned') || '[]');
    var wrongIds = JSON.parse(localStorage.getItem('juli_wrong_ids') || '[]');
    var correctCount = JSON.parse(localStorage.getItem('juli_correct_count') || '{}');
    var wrongCount = JSON.parse(localStorage.getItem('juli_wrong_count') || '{}');
    var currentLevel = parseInt(localStorage.getItem('juli_level')) || 1;
    var dailyGoal = parseInt(localStorage.getItem('juli_daily_goal')) || 5;

    // ============ TOAST ============
    function showToast(msg, icon) {
      icon = icon || 'fa-info-circle';
      var toast = document.getElementById('toast');
      toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + msg;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    // ============ RENDER ============
    function render() {
      var total = allSentences.length;
      var learned = learnedIds.length;
      var pct = total > 0 ? Math.round((learned / total) * 100) : 0;

      document.getElementById('totalLearned').textContent = learned;
      document.getElementById('totalSentences').textContent = total;
      document.getElementById('progressPercent').textContent = pct + '%';
      document.getElementById('overallFill').style.width = pct + '%';
      document.getElementById('overallLabel').textContent = pct + '%';

      renderLevels();
      renderChart();
      renderWrongList();
      renderTip();
    }

    // ============ LEVELS ============
    function renderLevels() {
      var grid = document.getElementById('levelGrid');
      grid.innerHTML = '';

      var totalLevels = Math.ceil(allSentences.length / dailyGoal);
      var maxLevels = Math.min(totalLevels, 12);

      for (var i = 1; i <= maxLevels; i++) {
        var startIdx = (i - 1) * dailyGoal;
        var endIdx = Math.min(startIdx + dailyGoal, allSentences.length);
        var levelSentences = allSentences.slice(startIdx, endIdx);
        var learnedInLevel = levelSentences.filter(function(s) { return learnedIds.indexOf(s.id) !== -1; }).length;
        var isComplete = learnedInLevel >= levelSentences.length && levelSentences.length > 0;
        var isUnlocked = i <= currentLevel || isComplete;

        var box = document.createElement('div');
        box.className = 'level-box';
        if (isComplete) box.classList.add('completed');
        else if (isUnlocked) box.classList.add('unlocked');
        else box.classList.add('locked');

        var icon = '🔒';
        if (isComplete) icon = '✅';
        else if (isUnlocked) icon = '📖';

        box.innerHTML = 
          '<span class="level-num">Lv.' + i + '</span>' +
          '<span class="level-icon">' + icon + '</span>' +
          '<span class="level-label">' + learnedInLevel + '/' + levelSentences.length + '</span>' +
          (isComplete ? '<span class="check">✓</span>' : '');

        box.addEventListener('click', function(level) {
          return function() {
            if (level <= currentLevel) {
              showToast('📚 等级 ' + level + ' — ' + (levelSentences.length) + ' 个句子', 'fa-book-open');
            } else {
              showToast('🔒 需要先完成等级 ' + (level - 1), 'fa-lock');
            }
          };
        }(i));

        grid.appendChild(box);
      }
    }

    // ============ CHART ============
    function renderChart() {
      var container = document.getElementById('chartBars');
      container.innerHTML = '';

      var maxHeight = 70;
      var totalLevels = Math.ceil(allSentences.length / dailyGoal);
      var levels = Math.min(totalLevels, 7);

      for (var i = 0; i < levels; i++) {
        var startIdx = i * dailyGoal;
        var endIdx = Math.min(startIdx + dailyGoal, allSentences.length);
        var levelSentences = allSentences.slice(startIdx, endIdx);
        var learnedInLevel = levelSentences.filter(function(s) { return learnedIds.indexOf(s.id) !== -1; }).length;
        var pct = levelSentences.length > 0 ? (learnedInLevel / levelSentences.length) : 0;

        var wrap = document.createElement('div');
        wrap.className = 'chart-bar-wrap';

        var bar = document.createElement('div');
        bar.className = 'chart-bar' + (pct > 0 ? ' done' : '');
        var height = Math.max(4, pct * maxHeight);
        bar.style.height = height + 'px';

        var label = document.createElement('span');
        label.className = 'chart-bar-label';
        label.textContent = 'Lv' + (i + 1);

        wrap.appendChild(bar);
        wrap.appendChild(label);
        container.appendChild(wrap);
      }
    }

    // ============ WRONG LIST ============
    function renderWrongList() {
      var list = document.getElementById('wrongList');
      var badge = document.getElementById('wrongBadge');
      var wrongSentences = allSentences.filter(function(s) { return wrongIds.indexOf(s.id) !== -1; });

      badge.textContent = wrongSentences.length;

      if (wrongSentences.length === 0) {
        list.innerHTML = '<div class="wrong-empty">🎉 没有错题！继续保持！</div>';
        return;
      }

      list.innerHTML = '';
      for (var i = 0; i < Math.min(wrongSentences.length, 5); i++) {
        var s = wrongSentences[i];
        var count = wrongCount[s.id] || 0;
        var item = document.createElement('div');
        item.className = 'wrong-item';
        item.innerHTML = 
          '<span class="chinese">' + s.chinese + '</span>' +
          '<span class="trans">' + (s.translation || '') + '</span>' +
          '<span class="count">✕' + count + '</span>';
        list.appendChild(item);
      }

      if (wrongSentences.length > 5) {
        var more = document.createElement('div');
        more.className = 'wrong-item';
        more.style.justifyContent = 'center';
        more.style.color = 'var(--text-secondary)';
        more.style.fontSize = '0.5rem';
        more.textContent = '+' + (wrongSentences.length - 5) + ' 更多';
        list.appendChild(more);
      }
    }

    // ============ TIP ============
    function renderTip() {
      var tips = [
        '复习错题是提升最快的方式！',
        '坚持比强度更重要 —— 每天学一点点。',
        '尝试在日常生活中使用新学的句子。',
        '多听发音可以帮助记忆。',
        '手写汉字能加深印象。',
        '适当休息，大脑需要时间消化知识。',
        '把新词与已知的事物联系起来。'
      ];
      var tipEl = document.getElementById('tipText');
      var idx = Math.floor(Math.random() * tips.length);
      tipEl.textContent = tips[idx];
    }

    // ============ NAV ============
    document.getElementById('goHomeBtn').addEventListener('click', function() {
      window.location.href = 'index.html';
    });

    document.querySelectorAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var page = this.dataset.page;
        if (page === 'home') window.location.href = 'index.html';
        else if (page === 'learn') window.location.href = 'learn.html';
        else if (page === 'review') window.location.href = 'review.html';
        else if (page === 'progress') { /* already here */ }
        else if (page === 'profile') window.location.href = 'profile.html';
      });
    });

    // ============ INIT ============
    render();
    console.log('✅ HanLingo Progress ready | ' + learnedIds.length + ' learned, ' + allSentences.length + ' total');
  </script>
</body>
</html>
