  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f9f7f5; color: #1e1e2a; line-height: 1.5; padding: 0 0 80px 0; min-height: 100vh; }
    .app-container { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 90vh; border-radius: 0 0 24px 24px; overflow: hidden; position: relative; }
    .status-bar { background: #1e1e2a; color: #f0ede8; padding: 6px 20px; display: flex; justify-content: space-between; font-size: 0.55rem; letter-spacing: 0.4px; font-weight: 500; }
    .header { padding: 12px 20px 8px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #efebe8; }
    
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 2px 6px; border-radius: 10px; transition: all 0.2s ease; animation: logoFloat 3s ease-in-out infinite; }
    .logo-area:hover { background: #f5f2ef; }
    .logo-area:active { animation: logoPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes logoPop { 0% { transform: scale(1); } 30% { transform: scale(0.85) rotate(-3deg); } 60% { transform: scale(1.12) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .logo-icon { background: #FF6B35; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 700; box-shadow: 0 3px 10px rgba(255,107,53,0.2); transition: all 0.3s ease; }
    .logo-area:hover .logo-icon { transform: rotate(-6deg) scale(1.05); box-shadow: 0 5px 16px rgba(255,107,53,0.3); }
    .logo-text { font-weight: 700; font-size: 1rem; letter-spacing: -0.2px; transition: all 0.3s ease; }
    .logo-area:hover .logo-text { transform: scale(1.02); }
    .logo-text .han { color: #1e1e2a; }
    .logo-text .lingo { color: #FF6B35; }
    .header-actions { display: flex; gap: 14px; color: #898999; font-size: 1rem; }
    .progress-container { padding: 14px 18px 10px 18px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-box { background: #ffffff; border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid #efebe8; }
    .stat-box .num { font-size: 1.3rem; font-weight: 700; color: #1e1e2a; }
    .stat-box .num.orange { color: #FF6B35; }
    .stat-box .num.green { color: #2d6a4f; }
    .stat-box .label { font-size: 0.5rem; color: #6a6a7a; margin-top: 2px; }

    /* Progress Bar Section */
    .progress-section { background: #ffffff; border-radius: 14px; padding: 16px 18px; border: 1px solid #efebe8; margin-bottom: 14px; }
    .progress-section .title { font-size: 0.7rem; font-weight: 600; color: #1e1e2a; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .progress-section .title i { color: #FF6B35; }
    .progress-section .bar-wrap { display: flex; align-items: center; gap: 12px; }
    .progress-section .bar-track { flex: 1; height: 6px; background: #e6e0db; border-radius: 20px; overflow: hidden; }
    .progress-section .bar-track .fill { height: 100%; background: linear-gradient(90deg, #FF6B35, #f7934b); border-radius: 20px; transition: width 0.8s ease; }
    .progress-section .bar-label { font-size: 0.7rem; font-weight: 600; color: #4a4a5a; min-width: 44px; text-align: right; }

    /* Level Grid */
    .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 4px 0; }
    .level-box { background: #f8f6f3; border-radius: 10px; padding: 10px 4px; text-align: center; border: 1px solid #efebe8; transition: 0.2s; position: relative; }
    .level-box.unlocked { border-color: #FF6B35; background: #fef9f5; }
    .level-box.completed { border-color: #2d6a4f; background: #d4edda; }
    .level-box.locked { opacity: 0.5; }
    .level-box .level-num { font-size: 0.6rem; font-weight: 700; color: #1e1e2a; }
    .level-box .level-icon { font-size: 0.8rem; display: block; margin: 2px 0; }
    .level-box .level-label { font-size: 0.45rem; color: #6a6a7a; }
    .level-box .check { position: absolute; top: -4px; right: -4px; background: #2d6a4f; color: white; border-radius: 50%; width: 16px; height: 16px; font-size: 8px; display: flex; align-items: center; justify-content: center; }
    .level-box .lock-icon { font-size: 0.6rem; color: #b0a8a2; }

    /* Chart Section */
    .chart-section { background: #ffffff; border-radius: 14px; padding: 16px 18px; border: 1px solid #efebe8; margin-bottom: 14px; }
    .chart-section .title { font-size: 0.7rem; font-weight: 600; color: #1e1e2a; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .chart-section .title i { color: #FF6B35; }
    .chart-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 80px; gap: 4px; padding-top: 4px; }
    .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
    .chart-bar { width: 100%; max-width: 28px; border-radius: 4px 4px 0 0; transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); min-height: 2px; background: #e6e0db; }
    .chart-bar.done { background: linear-gradient(180deg, #FF6B35, #f7934b); }
    .chart-bar-label { font-size: 0.4rem; color: #6a6a7a; margin-top: 4px; text-align: center; }

    /* Wrong List (compact) */
    .wrong-section { background: #ffffff; border-radius: 14px; padding: 14px 16px; border: 1px solid #efebe8; margin-bottom: 14px; }
    .wrong-section .title { font-size: 0.7rem; font-weight: 600; color: #1e1e2a; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .wrong-section .title i { color: #d9534f; }
    .wrong-section .title .badge { font-size: 0.45rem; font-weight: 600; background: #f8d7da; color: #721c24; padding: 0px 8px; border-radius: 30px; }
    .wrong-list { max-height: 120px; overflow-y: auto; }
    .wrong-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 0.5px solid #f5f2ef; font-size: 0.6rem; }
    .wrong-item:last-child { border-bottom: none; }
    .wrong-item .chinese { font-weight: 500; color: #1e1e2a; }
    .wrong-item .trans { color: #6a6a7a; }
    .wrong-item .count { font-size: 0.5rem; color: #d9534f; font-weight: 600; }
    .wrong-empty { font-size: 0.6rem; color: #9b9390; text-align: center; padding: 8px 0; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e8e2dc; display: flex; justify-content: space-around; padding: 4px 0 8px 0; max-width: 480px; margin: 0 auto; backdrop-filter: blur(8px); background: rgba(255,255,255,0.92); }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #898999; font-size: 0.4rem; font-weight: 500; gap: 0px; cursor: pointer; padding: 2px 10px; border-radius: 20px; transition: 0.1s; }
    .nav-item i { font-size: 1rem; color: #6b6b7b; }
    .nav-item.active i { color: #FF6B35; }
    .nav-item.active { color: #1e1e2a; }
    .nav-item:active { background: #f0edeb; }

    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e1e2a; color: #f0ede8; padding: 8px 18px; border-radius: 60px; font-size: 0.7rem; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.15); opacity: 0; transition: all 0.3s ease; z-index: 200; max-width: 90%; text-align: center; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast i { margin-right: 6px; color: #f7934b; }

    @media (max-width: 400px) {
      .stats-grid { grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
      .stat-box { padding: 8px 4px; }
      .stat-box .num { font-size: 1rem; }
      .level-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
      .level-box { padding: 6px 2px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>HanLingo</span>
      <span>Progress</span>
    </div>

    <header class="header">
      <div class="logo-area" id="goHomeBtn">
        <div class="logo-icon">HL</div>
        <div class="logo-text">
          <span class="han">Han</span><span class="lingo">Lingo</span>
        </div>
      </div>
      <div class="header-actions">
        <i class="far fa-bell"></i>
        <i class="far fa-user-circle"></i>
      </div>
    </header>

    <div class="progress-container">
      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="num orange" id="totalLearned">0</div>
          <div class="label">✅ Learned</div>
        </div>
        <div class="stat-box">
          <div class="num" id="totalSentences">0</div>
          <div class="label">📚 Total</div>
        </div>
        <div class="stat-box">
          <div class="num green" id="progressPercent">0%</div>
          <div class="label">📈 Progress</div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <div class="title"><i class="fas fa-chart-line"></i> Overall Progress</div>
        <div class="bar-wrap">
          <div class="bar-track"><div class="fill" id="overallFill" style="width:0%;"></div></div>
          <span class="bar-label" id="overallLabel">0%</span>
        </div>
      </div>

      <!-- Level Grid -->
      <div class="progress-section">
        <div class="title"><i class="fas fa-layer-group"></i> Levels</div>
        <div class="level-grid" id="levelGrid"></div>
      </div>

      <!-- Chart -->
      <div class="chart-section">
        <div class="title"><i class="fas fa-chart-bar"></i> Learning Activity</div>
        <div class="chart-bars" id="chartBars"></div>
      </div>

      <!-- Wrong List -->
      <div class="wrong-section" id="wrongSection">
        <div class="title">
          <i class="fas fa-times-circle"></i> Needs Review
          <span class="badge" id="wrongBadge">0</span>
        </div>
        <div class="wrong-list" id="wrongList">
          <div class="wrong-empty">🎉 No wrong answers! Keep it up!</div>
        </div>
      </div>

      <!-- Study Tips -->
      <div style="background:#fef9f5; border-radius:12px; padding:12px 14px; border:1px solid #FF6B35; margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:1.1rem;">💡</span>
          <div>
            <div style="font-size:0.65rem; font-weight:600; color:#1e1e2a;">Study Tip</div>
            <div style="font-size:0.55rem; color:#6a6a7a;" id="tipText">Review your wrong answers to improve faster!</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>Home</span></div>
      <div class="nav-item" data-page="learn"><i class="fas fa-book-open"></i><span>Learn</span></div>
      <div class="nav-item" data-page="review"><i class="fas fa-sync-alt"></i><span>Review</span></div>
      <div class="nav-item active" data-page="progress"><i class="fas fa-chart-simple"></i><span>Progress</span></div>
      <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Profile</span></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="data/sentences.js"></script>
  <script>
    // ============ DATA ============
    var allSentences = (typeof HSK1_SENTENCES !== 'undefined') ? HSK1_SENTENCES : [];
    var learnedIds = JSON.parse(localStorage.getItem('juli_learned') || '[]');
    var wrongIds = JSON.parse(localStorage.getItem('juli_wrong_ids') || '[]');
    var correctCount = JSON.parse(localStorage.getItem('juli_correct_count') || '{}');
    var wrongCount = JSON.parse(localStorage.getItem('juli_wrong_count') || '{}');
    var currentLevel = parseInt(localStorage.getItem('juli_level')) || 1;
    var dailyGoal = parseInt(localStorage.getItem('juli_daily_goal')) || 5;

    // ============ TOAST ============
    function showToast(msg, icon) {
      icon = icon || 'fa-info-circle';
      var toast = document.getElementById('toast');
      toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + msg;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    // ============ RENDER ============
    function render() {
      var total = allSentences.length;
      var learned = learnedIds.length;
      var pct = total > 0 ? Math.round((learned / total) * 100) : 0;

      document.getElementById('totalLearned').textContent = learned;
      document.getElementById('totalSentences').textContent = total;
      document.getElementById('progressPercent').textContent = pct + '%';
      document.getElementById('overallFill').style.width = pct + '%';
      document.getElementById('overallLabel').textContent = pct + '%';

      renderLevels();
      renderChart();
      renderWrongList();
      renderTip();
    }

    // ============ LEVELS ============
    function renderLevels() {
      var grid = document.getElementById('levelGrid');
      grid.innerHTML = '';

      var totalLevels = Math.ceil(allSentences.length / dailyGoal);
      var maxLevels = Math.min(totalLevels, 12);

      for (var i = 1; i <= maxLevels; i++) {
        var startIdx = (i - 1) * dailyGoal;
        var endIdx = Math.min(startIdx + dailyGoal, allSentences.length);
        var levelSentences = allSentences.slice(startIdx, endIdx);
        var learnedInLevel = levelSentences.filter(function(s) { return learnedIds.indexOf(s.id) !== -1; }).length;
        var isComplete = learnedInLevel >= levelSentences.length && levelSentences.length > 0;
        var isUnlocked = i <= currentLevel || isComplete;

        var box = document.createElement('div');
        box.className = 'level-box';
        if (isComplete) box.classList.add('completed');
        else if (isUnlocked) box.classList.add('unlocked');
        else box.classList.add('locked');

        var icon = '🔒';
        if (isComplete) icon = '✅';
        else if (isUnlocked) icon = '📖';

        box.innerHTML = 
          '<span class="level-num">Lv.' + i + '</span>' +
          '<span class="level-icon">' + icon + '</span>' +
          '<span class="level-label">' + learnedInLevel + '/' + levelSentences.length + '</span>' +
          (isComplete ? '<span class="check">✓</span>' : '');

        box.addEventListener('click', function(level) {
          return function() {
            if (level <= currentLevel) {
              showToast('📚 Level ' + level + ' — ' + (levelSentences.length) + ' sentences', 'fa-book-open');
            } else {
              showToast('🔒 Complete Level ' + (level - 1) + ' to unlock', 'fa-lock');
            }
          };
        }(i));

        grid.appendChild(box);
      }
    }

    // ============ CHART ============
    function renderChart() {
      var container = document.getElementById('chartBars');
      container.innerHTML = '';

      // Show last 7 days of activity (simulated from learned data)
      var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      var maxHeight = 70;

      // Calculate per-level progress for chart
      var totalLevels = Math.ceil(allSentences.length / dailyGoal);
      var levels = Math.min(totalLevels, 7);

      for (var i = 0; i < levels; i++) {
        var startIdx = i * dailyGoal;
        var endIdx = Math.min(startIdx + dailyGoal, allSentences.length);
        var levelSentences = allSentences.slice(startIdx, endIdx);
        var learnedInLevel = levelSentences.filter(function(s) { return learnedIds.indexOf(s.id) !== -1; }).length;
        var pct = levelSentences.length > 0 ? (learnedInLevel / levelSentences.length) : 0;

        var wrap = document.createElement('div');
        wrap.className = 'chart-bar-wrap';

        var bar = document.createElement('div');
        bar.className = 'chart-bar' + (pct > 0 ? ' done' : '');
        var height = Math.max(4, pct * maxHeight);
        bar.style.height = height + 'px';

        var label = document.createElement('span');
        label.className = 'chart-bar-label';
        label.textContent = 'Lv' + (i + 1);

        wrap.appendChild(bar);
        wrap.appendChild(label);
        container.appendChild(wrap);
      }
    }

    // ============ WRONG LIST ============
    function renderWrongList() {
      var list = document.getElementById('wrongList');
      var badge = document.getElementById('wrongBadge');
      var wrongSentences = allSentences.filter(function(s) { return wrongIds.indexOf(s.id) !== -1; });

      badge.textContent = wrongSentences.length;

      if (wrongSentences.length === 0) {
        list.innerHTML = '<div class="wrong-empty">🎉 No wrong answers! Keep it up!</div>';
        return;
      }

      list.innerHTML = '';
      for (var i = 0; i < Math.min(wrongSentences.length, 5); i++) {
        var s = wrongSentences[i];
        var count = wrongCount[s.id] || 0;
        var item = document.createElement('div');
        item.className = 'wrong-item';
        item.innerHTML = 
          '<span class="chinese">' + s.chinese + '</span>' +
          '<span class="trans">' + (s.translation || '') + '</span>' +
          '<span class="count">✕' + count + '</span>';
        list.appendChild(item);
      }

      if (wrongSentences.length > 5) {
        var more = document.createElement('div');
        more.className = 'wrong-item';
        more.style.justifyContent = 'center';
        more.style.color = '#9b9390';
        more.style.fontSize = '0.5rem';
        more.textContent = '+' + (wrongSentences.length - 5) + ' more';
        list.appendChild(more);
      }
    }

    // ============ TIP ============
    function renderTip() {
      var tips = [
        'Review your wrong answers to improve faster!',
        'Consistency beats intensity — study a little every day.',
        'Try to use new sentences in real conversations.',
        'Listening to pronunciation helps with memory.',
        'Writing characters by hand reinforces learning.',
        'Take breaks — your brain needs time to absorb.',
        'Connect new words to things you already know.'
      ];
      var tipEl = document.getElementById('tipText');
      var idx = Math.floor(Math.random() * tips.length);
      tipEl.textContent = tips[idx];
    }

    // ============ NAV ============
    document.getElementById('goHomeBtn').addEventListener('click', function() {
      window.location.href = 'index.html';
    });

    document.querySelectorAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var page = this.dataset.page;
        if (page === 'home') window.location.href = 'index.html';
        else if (page === 'learn') window.location.href = 'learn.html';
        else if (page === 'review') window.location.href = 'review.html';
        else if (page === 'progress') { /* already here */ }
        else if (page === 'profile') {
          alert('👤 HanLingo Profile\n\n' +
            '✅ Learned: ' + learnedIds.length + ' sentences\n' +
            '❌ Wrong: ' + wrongIds.length + ' sentences\n' +
            '📈 Level: ' + currentLevel + '\n' +
            '🔥 Streak: ' + (localStorage.getItem('juli_streak') || 0) + ' days\n' +
            '📊 Total correct: ' + Object.values(correctCount).reduce(function(a,b){return a+b}, 0) + '\n' +
            '📉 Total wrong: ' + Object.values(wrongCount).reduce(function(a,b){return a+b}, 0));
        }
      });
    });

    // ============ INIT ============
    render();
    console.log('✅ HanLingo Progress ready | ' + learnedIds.length + ' learned, ' + allSentences.length + ' total');
  </script>
</body>
</html>
