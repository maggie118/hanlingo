<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>安全结账 · HanLingo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico">
  
  <style>
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --blue: #007AFF;
      --blue-dark: #0066CC;
      --green: #34C759;
      --orange: #FF9500;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px;
      --radius-full: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.4; padding-bottom: 20px; }
    
    .checkout-container { max-width: 480px; margin: 40px auto; background: var(--surface); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); overflow: hidden; }
    
    .checkout-header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
    .back-btn { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .back-btn:hover { color: var(--blue); }
    .secure-title { font-size: 0.75rem; font-weight: 700; color: var(--blue); display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    .checkout-body { padding: 24px; }

    /* 订单明细卡片 */
    .order-summary-card { background: var(--bg); border-radius: var(--radius); padding: 16px; margin-bottom: 24px; }
    .summary-title { font-size: 0.65rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
    .product-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .product-info .p-name { font-size: 0.95rem; font-weight: 800; }
    .product-info .p-badge { background: var(--orange); color: white; font-size: 0.5rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 4px; text-transform: uppercase; }
    .product-info .p-desc { font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; }
    .product-price { font-size: 1.1rem; font-weight: 800; color: var(--blue); }
    
    .total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; font-size: 0.9rem; font-weight: 700; }
    .total-row .saved-tag { color: var(--green); background: #E8F8ED; font-size: 0.55rem; padding: 2px 8px; border-radius: 12px; margin-left: 6px; font-weight: 600; }

    /* 支付表单 */
    .form-section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: var(--text); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.65rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; font-size: 0.85rem; color: var(--text); transition: all 0.2s; font-family: inherit; }
    .form-group input:focus { outline: none; border-color: var(--blue); background: var(--surface); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
    
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-with-icon { position: relative; }
    .input-with-icon i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 0.9rem; }

    .card-brands { display: flex; gap: 6px; margin-top: 4px; font-size: 1.1rem; color: #D1D1D6; }
    .card-brands i.active { color: var(--text); }

    .pay-submit-btn { background: var(--blue); border: none; color: white; padding: 14px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,122,255,0.2); width: 100%; margin: 24px 0 16px 0; transition: 0.2s; }
    .pay-submit-btn:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,122,255,0.3); }

    .trust-badges { background: var(--bg); border: 1px dashed var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
    .trust-badges .guarantee-text { font-size: 0.65rem; font-weight: 600; color: var(--text); margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .trust-badges .guarantee-desc { font-size: 0.55rem; color: var(--text-secondary); line-height: 1.4; }
    .trust-badges .sub-text { font-size: 0.5rem; color: var(--text-secondary); margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
  </style>
</head>
<body>
  <div class="checkout-container">
    <div class="checkout-header">
      <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回</a>
      <div class="secure-title"><i class="fas fa-lock"></i> 安全结账</div>
    </div>

    <div class="checkout-body">
      <div class="order-summary-card">
        <div class="summary-title">您的订单</div>
        <div class="product-row">
          <div class="product-info">
            <span class="p-name">HanLingo 终身会员</span><span class="p-badge">早鸟价</span>
            <div class="p-desc">解锁 HSK 1-6 高级练习册及所有未来更新。</div>
          </div>
          <div class="product-price">$149.99</div>
        </div>
        <div class="total-row">
          <span>今日应付总额:</span>
          <div>
            <span class="saved-tag">节省 $50.00</span>
            <span style="color: var(--blue); font-size: 1.2rem; margin-left: 6px;">$149.99</span>
          </div>
        </div>
      </div>

      <form id="checkout-form" onsubmit="handlePayment(event)">
        <div class="form-section-title"><i class="far fa-envelope"></i> 1. 账户详情</div>
        <div class="form-group">
          <label for="email">电子邮箱</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-section-title" style="margin-top: 20px;"><i class="far fa-credit-card"></i> 2. 支付方式</div>
        <div class="form-group">
          <label for="card-number">卡号</label>
          <div class="input-with-icon">
            <input type="text" id="card-number" placeholder="4242 •••• •••• ••••" inputmode="numeric" maxlength="19" required>
            <i class="fas fa-credit-card"></i>
          </div>
          <div class="card-brands">
            <i class="fab fa-cc-visa" title="Visa"></i>
            <i class="fab fa-cc-mastercard" title="Mastercard"></i>
            <i class="fab fa-cc-amex" title="American Express"></i>
            <i class="fab fa-cc-discover" title="Discover"></i>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="card-expiry">有效期</label>
            <input type="text" id="card-expiry" placeholder="MM / YY" inputmode="numeric" maxlength="5" required>
          </div>
          <div class="form-group">
            <label for="card-cvc">CVC / CVV</label>
            <div class="input-with-icon">
              <input type="password" id="card-cvc" placeholder="123" inputmode="numeric" maxlength="4" required>
              <i class="far fa-question-circle" title="3或4位安全码"></i>
            </div>
          </div>
        </div>

        <button type="submit" class="pay-submit-btn" id="submit-btn">
          <i class="fas fa-shield-alt"></i> 安全支付 $149.99
        </button>
      </form>

      <div class="trust-badges">
        <div class="guarantee-text"><i class="fas fa-check-circle"></i> 30天无理由退款保证</div>
        <div class="guarantee-desc">如果您对 HanLingo 的内容不完全满意，请于30天内联系我们，即可获得全额退款。</div>
        <div class="sub-text">
          <span><i class="fas fa-lock"></i> 256位 SSL 加密</span>
          <span><i class="fas fa-check"></i> Stripe 认证</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('card-number').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });
    document.getElementById('card-expiry').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/^(\d{2})/, '$1/').trim();
    });

    function handlePayment(event) {
      event.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';
      btn.disabled = true;

      setTimeout(() => {
        alert("🎉 感谢您的购买！欢迎加入 HanLingo 终身会员。");
        window.location.href = "index.html";
      }, 2500);
    }
  </script>
</body>
</html>
