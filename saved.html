<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  
  <!-- ===== Title ===== -->
  <title>HanLingo · 收藏</title>
  
  <!-- ===== SEO Meta ===== -->
  <meta name="description" content="查看和管理您收藏的中文句子。">
  <meta name="author" content="HanLingo">
  <meta name="robots" content="index, follow">
  
  <!-- ===== Open Graph ===== -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hanlingo.app/saved.html">
  <meta property="og:title" content="HanLingo · 收藏">
  <meta property="og:image" content="https://hanlingo.app/icon-512.png">
  <meta property="og:site_name" content="HanLingo">
  
  <!-- ===== PWA ===== -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" href="/favicon.ico">
  
  <!-- ===== Font Awesome ===== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    /* ===== 全局变量 ===== */
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --blue: #007AFF;
      --blue-dark: #0066CC;
      --green: #34C759;
      --red: #FF3B30;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px;
      --radius-full: 60px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.5; padding: 0 0 80px 0; min-height: 100vh; }
    
    .app-container { max-width: 480px; margin: 0 auto; background: var(--surface); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.02); }
    
    /* ===== 状态栏 ===== */
    .status-bar { background: var(--surface); padding: 8px 20px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    
    /* ===== 头部 ===== */
    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
    .logo-area:hover { opacity: 0.8; }
    .logo-icon { background: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 700; }
    .logo-text { font-weight: 700; font-size: 1rem; }
    .logo-text .han { color: var(--text); }
    .logo-text .lingo { color: var(--blue); }
    .header-actions { display: flex; gap: 14px; color: var(--text-secondary); font-size: 1rem; align-items: center; }
    .header-actions i { cursor: pointer; transition: 0.2s; }
    .header-actions i:hover { color: var(--blue); }

    /* ===== 内容区 ===== */
    .saved-container { padding: 16px 20px 10px 20px; }

    /* 统计数据 */
    .stats-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .stat-card { flex: 1; background: var(--bg); border-radius: var(--radius); padding: 10px 12px; text-align: center; }
    .stat-card .num { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .stat-card .num.blue { color: var(--blue); }
    .stat-card .num.green { color: var(--green); }
    .stat-card .label { font-size: 0.5rem; color: var(--text-secondary); margin-top: 1px; }

    /* 搜索与过滤 */
    .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .search-bar input { flex: 1; padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 0.7rem; background: var(--bg); outline: none; transition: 0.2s; font-family: inherit; }
    .search-bar input:focus { border-color: var(--blue); background: white; }
    .search-bar .filter-btn { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: 0.2s; color: var(--text-secondary); font-size: 0.7rem; font-family: inherit; }
    .search-bar .filter-btn:hover { border-color: var(--blue); }
    .search-bar .filter-btn.active { border-color: var(--blue); background: #F0F7FF; color: var(--blue); }

    /* 收藏列表 */
    .saved-list { display: flex; flex-direction: column; gap: 8px; }
    .saved-item { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); transition: all 0.2s ease; cursor: pointer; }
    .saved-item:hover { border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,122,255,0.04); }
    .saved-item .chinese { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    .saved-item .pinyin { font-size: 0.6rem; color: var(--text-secondary); margin: 1px 0; }
    .saved-item .translation { font-size: 0.6rem; color: var(--text); background: var(--bg); padding: 1px 12px; border-radius: var(--radius-full); display: inline-block; margin: 3px 0; }
    .saved-item .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .saved-item .meta .tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .saved-item .meta .tag { font-size: 0.4rem; font-weight: 600; color: var(--text-secondary); background: var(--bg); padding: 1px 8px; border-radius: 30px; }
    .saved-item .meta .actions { display: flex; gap: 6px; }
    .saved-item .meta .actions button { background: none; border: none; cursor: pointer; color: var(--text-secondary); transition: 0.2s; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
    .saved-item .meta .actions button:hover { background: var(--bg); color: var(--blue); }
    .saved-item .meta .actions .remove-btn:hover { color: var(--red); background: #FFF0EF; }
    .saved-item .learned-badge { font-size: 0.4rem; font-weight: 600; color: var(--green); background: #E8F8ED; padding: 1px 8px; border-radius: 30px; }

    /* 空状态 */
    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-state .icon { font-size: 3rem; color: var(--border); margin-bottom: 10px; }
    .empty-state .title { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .empty-state .desc { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
    .empty-state .btn { background: var(--blue); border: none; color: white; padding: 10px 24px; border-radius: var(--radius-full); font-weight: 600; font-size: 0.75rem; cursor: pointer; transition: 0.2s; margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
    .empty-state .btn:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,122,255,0.2); }

    /* ===== Toast ===== */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(29,29,31,0.9); backdrop-filter: blur(12px); color: white; padding: 12px 24px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s ease; z-index: 200; max-width: 90%; text-align: center; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast i { margin-right: 8px; color: #5AC8FA; }

    /* ===== 底部导航 ===== */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px 0; max-width: 480px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 0.55rem; font-weight: 500; gap: 1px; cursor: pointer; padding: 4px 12px; border-radius: 20px; transition: 0.1s; }
    .nav-item i { font-size: 1.3rem; color: var(--text-secondary); }
    .nav-item.active i { color: var(--blue); }
    .nav-item.active { color: var(--text); }
    .nav-item:active { background: var(--bg); }

    @media (max-width: 400px) {
      .stats-row { gap: 6px; }
      .stat-card { padding: 8px 6px; }
      .stat-card .num { font-size: 0.9rem; }
      .saved-item { padding: 12px 14px; }
      .saved-item .chinese { font-size: 1rem; }
      .search-bar { flex-wrap: wrap; }
      .search-bar input { min-width: 120px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="status-bar">
    <span>HanLingo</span>
    <span>收藏</span>
  </div>

  <header class="header">
    <div class="logo-area" id="goHomeBtn">
      <div class="logo-icon">HL</div>
      <div class="logo-text">
        <span class="han">Han</span><span class="lingo">Lingo</span>
      </div>
    </div>
    <div class="header-actions">
      <i class="fas fa-arrow-left" id="backBtn" title="返回" style="cursor:pointer;"></i>
    </div>
  </header>

  <div class="saved-container">
    <!-- 统计 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="num blue" id="totalSaved">0</div>
        <div class="label">⭐ 收藏</div>
      </div>
      <div class="stat-card">
        <div class="num" id="totalLearned">0</div>
        <div class="label">✅ 已学</div>
      </div>
      <div class="stat-card">
        <div class="num green" id="totalAll">0</div>
        <div class="label">📚 总数</div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索收藏的句子...">
      <button class="filter-btn active" id="filterAll">全部</button>
      <button class="filter-btn" id="filterLearned">✅ 已学</button>
    </div>

    <!-- 收藏列表 -->
    <div class="saved-list" id="savedList"></div>

    <div style="text-align:center; padding:12px 0 6px; font-size:0.5rem; color:var(--text-secondary);">
      <i class="fas fa-bookmark"></i> 您的收藏
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>主页</span></div>
    <div class="nav-item" data-page="learn"><i class="fas fa-book-open"></i><span>课程</span></div>
    <div class="nav-item" data-page="quest"><i class="fas fa-flag"></i><span>闯关</span></div>
    <div class="nav-item active" data-page="saved"><i class="fas fa-bookmark"></i><span>收藏</span></div>
    <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>个人</span></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data/sentences.js"></script>
  <script>
    // ============================================================
    // DATA
    // ============================================================
    var allSentences = (typeof HSK1_SENTENCES !== 'undefined') ? HSK1_SENTENCES : [];
    var savedIds = JSON.parse(localStorage.getItem('juli_saved') || '[]');
    var learnedIds = JSON.parse(localStorage.getItem('juli_learned') || '[]');

    var filterMode = 'all'; // 'all' | 'learned'
    var searchQuery = '';

    // ============================================================
    // DOM
    // ============================================================
    var savedList = document.getElementById('savedList');
    var totalSavedEl = document.getElementById('totalSaved');
    var totalLearnedEl = document.getElementById('totalLearned');
    var totalAllEl = document.getElementById('totalAll');
    var searchInput = document.getElementById('searchInput');

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, icon) {
      icon = icon || 'fa-info-circle';
      var toast = document.getElementById('toast');
      toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + message;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2800);
    }

    // ============================================================
    // RENDER
    // ============================================================
    function render() {
      // Get saved sentences
      var savedSentences = allSentences.filter(function(s) {
        return savedIds.indexOf(s.id) !== -1;
      });

      // Apply filters
      var filtered = savedSentences.filter(function(s) {
        // Filter by search
        if (searchQuery) {
          var q = searchQuery.toLowerCase();
          var match = s.chinese.includes(q) || 
                      (s.pinyin && s.pinyin.toLowerCase().includes(q)) ||
                      (s.translation && s.translation.toLowerCase().includes(q));
          if (!match) return false;
        }
        // Filter by learned status
        if (filterMode === 'learned') {
          return learnedIds.indexOf(s.id) !== -1;
        }
        return true;
      });

      // Update stats
      totalSavedEl.textContent = savedSentences.length;
      totalLearnedEl.textContent = learnedIds.length;
      totalAllEl.textContent = allSentences.length;

      // Render list
      if (filtered.length === 0) {
        savedList.innerHTML = `
          <div class="empty-state">
            <div class="icon">📖</div>
            <div class="title">暂无收藏</div>
            <div class="desc">${searchQuery ? '尝试其他关键词吧。' : '开始学习并收藏您想记住的句子！'}</div>
            <button class="btn" onclick="location.href='learn.html'">
              <i class="fas fa-book-open"></i> 开始学习
            </button>
          </div>
        `;
        return;
      }

      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var s = filtered[i];
        var isLearned = learnedIds.indexOf(s.id) !== -1;
        var num = i + 1;

        html += `
          <div class="saved-item" data-id="${s.id}">
            <div class="chinese">${s.chinese}</div>
            <div class="pinyin">${s.pinyin || ''}</div>
            <div class="translation">${s.translation || ''}</div>
            <div class="meta">
              <div class="tags">
                ${isLearned ? '<span class="learned-badge">✅ 已学</span>' : ''}
                ${s.vocab ? '<span class="tag">📖 ' + s.vocab.substring(0, 20) + (s.vocab.length > 20 ? '...' : '') + '</span>' : ''}
              </div>
              <div class="actions">
                <button class="learn-toggle-btn" title="${isLearned ? '标记为未学' : '标记为已学'}" data-id="${s.id}">
                  <i class="fas ${isLearned ? 'fa-check-circle' : 'fa-circle'}"></i>
                </button>
                <button class="remove-btn" title="移除收藏" data-id="${s.id}">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      savedList.innerHTML = html;

      // Bind events
      document.querySelectorAll('.remove-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = this.dataset.id;
          removeSaved(id);
        });
      });

      document.querySelectorAll('.learn-toggle-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var id = this.dataset.id;
          toggleLearned(id);
        });
      });

      // Click on item to go to learn page with that sentence
      document.querySelectorAll('.saved-item').forEach(function(item) {
        item.addEventListener('click', function() {
          var id = this.dataset.id;
          var idx = allSentences.findIndex(function(s) { return s.id === id; });
          if (idx > -1) {
            localStorage.setItem('juli_learn_index', idx);
            window.location.href = 'learn.html';
          }
        });
      });
    }

    // ============================================================
    // ACTIONS
    // ============================================================
    function removeSaved(id) {
      var idx = savedIds.indexOf(id);
      if (idx > -1) {
        savedIds.splice(idx, 1);
        localStorage.setItem('juli_saved', JSON.stringify(savedIds));
        showToast('🗑️ 已移除', 'fa-trash-alt');
        render();
      }
    }

    function toggleLearned(id) {
      var idx = learnedIds.indexOf(id);
      if (idx > -1) {
        learnedIds.splice(idx, 1);
        showToast('📖 取消标记', 'fa-undo');
      } else {
        learnedIds.push(id);
        showToast('✅ 标记为已学！', 'fa-check-circle');
      }
      localStorage.setItem('juli_learned', JSON.stringify(learnedIds));
      render();
    }

    // ============================================================
    // SEARCH & FILTER
    // ============================================================
    searchInput.addEventListener('input', function() {
      searchQuery = this.value.trim();
      render();
    });

    document.getElementById('filterAll').addEventListener('click', function() {
      filterMode = 'all';
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      render();
    });

    document.getElementById('filterLearned').addEventListener('click', function() {
      filterMode = 'learned';
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      render();
    });

    // ============================================================
    // NAVIGATION
    // ============================================================
    document.getElementById('goHomeBtn').addEventListener('click', function() {
      window.location.href = 'index.html';
    });

    document.getElementById('backBtn').addEventListener('click', function() {
      window.history.back();
    });

    document.querySelectorAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var page = this.dataset.page;
        if (page === 'home') window.location.href = 'index.html';
        else if (page === 'learn') window.location.href = 'learn.html';
        else if (page === 'quest') window.location.href = 'quest.html';
        else if (page === 'saved') { /* already here */ }
        else if (page === 'profile') window.location.href = 'profile.html';
      });
    });

    // ============================================================
    // SYNC WITH STORAGE CHANGES
    // ============================================================
    window.addEventListener('storage', function(e) {
      if (e.key === 'juli_saved' || e.key === 'juli_learned') {
        savedIds = JSON.parse(localStorage.getItem('juli_saved') || '[]');
        learnedIds = JSON.parse(localStorage.getItem('juli_learned') || '[]');
        render();
      }
    });

    // ============================================================
    // INIT
    // ============================================================
    render();
    console.log('✅ HanLingo Saved ready | ' + savedIds.length + ' saved sentences');
  </script>
</body>
</html>
