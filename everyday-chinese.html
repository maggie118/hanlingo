<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HanLingo · Everyday Chinese</title>
<meta name="description" content="Everyday Chinese — 常速 / 慢速跟读，拼音逐字高亮，按篇目筛选。">
<meta name="theme-color" content="#F4F3EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23C0584B'/%3E%3Ctext%20x='16'%20y='23'%20font-size='18'%20font-weight='700'%20text-anchor='middle'%20fill='white'%20font-family='sans-serif'%3E%E6%B1%89%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #F4F3EF; --card: #FFFFFF; --text: #2C302E; --muted: #7B7F7A;
  --border: #E2E0D8; --accent: #C0584B; --accent-press: #A94A3E; --accent-soft: rgba(192,88,75,.10);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --gold: #F5A623;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  -webkit-font-smoothing: antialiased; line-height: 1.5;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 56px; }

/* ---------- header ---------- */
.brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: .01em; margin: 0; }
.brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.brand .sub { font-size: 13px; color: var(--muted); }
.lede { font-size: 13.5px; color: var(--muted); margin: 6px 0 20px; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; transition: background .18s, color .18s, border-color .18s, transform .18s;
  min-height: 34px;
}
.chip:hover { color: var(--text); border-color: #CFCBC0; background: #FBFBF8; }
.chip:active { transform: translateY(1px); }
.chip[aria-selected="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.chip .n { opacity: .6; font-size: 12px; margin-left: 5px; }

/* ---------- card ---------- */
.card {
  margin-top: 18px; background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 26px 24px 22px; box-shadow: 0 2px 10px rgba(44,48,46,.04);
  transition: box-shadow .2s;
}
.card.playing { box-shadow: 0 6px 22px rgba(192,88,75,.13); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.badge {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
  color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 4px 9px;
}
.counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.pinyin {
  font-size: clamp(15px, 4.4vw, 19px); font-weight: 500; color: var(--accent);
  letter-spacing: .02em; line-height: 1.7; word-break: break-word;
}
.hanzi {
  margin-top: 12px; font-size: clamp(30px, 9vw, 46px); font-weight: 700; line-height: 1.34;
  letter-spacing: .02em; word-break: break-word; line-break: strict;
}
.english { margin-top: 14px; font-size: 14.5px; color: var(--muted); line-height: 1.6; }
.usage {
  margin-top: 12px; font-size: 12.5px; color: var(--muted);
  background: #FAFAF7; border-left: 2px solid var(--border); border-radius: 0 8px 8px 0; padding: 8px 12px;
}
.usage:empty { display: none; }

/* ---------- tokens / highlight ---------- */
.tk { display: inline-block; transition: color .16s ease, background .16s ease, transform .16s ease; }
.tk-dim { display: inline-block; color: var(--muted); opacity: .5; }
.py-tk { color: rgba(192,88,75,.45); }
.hz-tk { color: var(--text); border-radius: 6px; padding: 0 1px; }
.hz-nowrap { display: inline-block; white-space: nowrap; }
.card.playing .py-tk { color: rgba(192,88,75,.34); }
.tk.on { color: var(--accent); transform: translateY(-3px) scale(1.14); }
.py-tk.on { font-weight: 700; }
.hz-tk.on { background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); animation: tkPop .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes tkPop { 0% { transform: translateY(0) scale(1); } 62% { transform: translateY(-7px) scale(1.24); } 100% { transform: translateY(-3px) scale(1.14); } }

/* ---------- controls ---------- */
.controls { margin-top: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.speed-group { display: inline-flex; background: #F1EFE9; border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 3px; }
.sp-btn {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 999px; padding: 7px 15px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
  transition: background .18s, color .18s, box-shadow .18s;
}
.sp-btn:hover { color: var(--text); background: rgba(255,255,255,.7); }
.sp-btn.active { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px rgba(44,48,46,.10); }
.sp-btn.playing .sp-ico { animation: spPulse 1s ease-in-out infinite; }
.sp-btn:disabled { opacity: .4; cursor: not-allowed; }
@keyframes spPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.86); } }

.btn {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 9px 16px; cursor: pointer; min-height: 38px;
  transition: background .18s, border-color .18s, transform .18s;
}
.btn:hover { background: #FBFBF8; border-color: #CFCBC0; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-press); border-color: var(--accent-press); }
.spacer { flex: 1 1 auto; }

.hint { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; letter-spacing: .02em; }
kbd {
  font: inherit; font-size: 11px; background: #F1EFE9; border: 1px solid var(--border);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; color: var(--text);
}

@media (max-width: 560px) {
  .wrap { padding: 20px 14px 44px; }
  .card { padding: 20px 16px 18px; border-radius: 16px; }
  .controls { gap: 8px; }
  .controls .spacer { display: none; }
  .btn, .sp-btn { white-space: nowrap; flex: 0 0 auto; }
  .speed-group { flex: 1 1 auto; justify-content: center; }
  .sp-btn { padding: 7px 10px; }
  .btn { padding: 9px 12px; font-size: 12.5px; }
  .hint { display: none; }
}
</style>
</head>

  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Everyday Chinese</h1>
      <span class="sub">生存中文 · 跟读训练</span>
    </div>
    <p class="lede">点「慢速」逐句模仿跟读，拼音与汉字会跟着发音跳动。</p>
  </header>

  <nav class="chips" id="chips" aria-label="篇目筛选"></nav>

  <section class="card" id="card">

      <span class="badge" id="badge">—</span>
      <span class="counter" id="counter">0 / 0</span>

    <div class="pinyin" id="pinyin"></div>

    <div class="controls">
      <div class="speed-group" role="group" aria-label="播放速度">

          <span class="sp-ico">🔊</span>常速

        <button class="sp-btn" id="spSlow" type="button" data-speed="slow" aria-pressed="false">
          <span class="sp-ico">🐢</span>慢速

      <span class="spacer"></span>
      <button class="btn" id="prev" type="button">← 上一句</button>

    </div>
  </section>

  <p class="hint">
    <kbd>空格</kbd> 播放 · <kbd>S</kbd> 慢速 · <kbd>←</kbd><kbd>→</kbd> 切换句子

<script id="payload" type="application/json">{"groups":[{"id":"cafe","icon":"☕","label":"咖啡 · 餐饮"},{"id":"transit","icon":"🚕","label":"打车 · 出行"},{"id":"payment","icon":"📱","label":"电子支付"},{"id":"social","icon":"💬","label":"社交破冰"},{"id":"essential","icon":"🆘","label":"保命句"},{"id":"scene","icon":"🏠","label":"生活情景"}],"items":[{"zh":"你好，一杯冰美式，带走。","pinyin":"Nǐ hǎo, yì bēi bīng měi shì, dài zǒu.","en":"Hi, one iced Americano to go.","usage":"The exact sentence you'll say at any café — swap 冰美式 for any drink.","group":"cafe","key":"d001"},{"zh":"我要一杯拿铁，少糖，谢谢。","pinyin":"Wǒ yào yì bēi ná tiě, shǎo táng, xiè xie.","en":"I'd like a latte with less sugar, thanks.","usage":"少糖 / 少冰 / 少奶 are your three customization words.","group":"cafe","key":"d002"},{"zh":"我不吃辣，少放盐，谢谢。","pinyin":"Wǒ bù chī là, shǎo fàng yán, xiè xie.","en":"I don't eat spicy, less salt please.","usage":"Say this before ordering and you'll actually enjoy the meal.","group":"cafe","key":"d003"},{"zh":"这个菜不要香菜。","pinyin":"Zhè ge cài bú yào xiāng cài.","en":"No cilantro in this dish.","usage":"Cilantro is the #1 thing foreigners forget to refuse.","group":"cafe","key":"d004"},{"zh":"我对花生过敏。","pinyin":"Wǒ duì huā shēng guò mǐn.","en":"I'm allergic to peanuts.","usage":"Crucial if you have food allergies — say it clearly.","group":"cafe","key":"d005"},{"zh":"请给我菜单。","pinyin":"Qǐng gěi wǒ cài dān.","en":"Please give me the menu.","usage":"The first thing to say when you sit down.","group":"cafe","key":"d006"},{"zh":"有推荐的吗？","pinyin":"Yǒu tuī jiàn de ma?","en":"Do you have any recommendations?","usage":"Ask the server — 推荐 = recommend.","group":"cafe","key":"d007"},{"zh":"我要这个。","pinyin":"Wǒ yào zhè ge.","en":"I'll have this one.","usage":"The most useful sentence when pointing at a menu.","group":"cafe","key":"d008"},{"zh":"这个好吃吗？","pinyin":"Zhè ge hǎo chī ma?","en":"Is this delicious?","usage":"Ask the server or a friend before committing.","group":"cafe","key":"d009"},{"zh":"很好吃。","pinyin":"Hěn hǎo chī.","en":"It's delicious.","usage":"Compliment the food after the first bite.","group":"cafe","key":"d010"},{"zh":"麻烦帮我打包。","pinyin":"Má fan bāng wǒ dǎ bāo.","en":"Could you pack this to go?","usage":"打包 (dǎ bāo) is the word for takeaway. 麻烦 makes it polite.","group":"cafe","key":"d011"},{"zh":"再来一碗米饭。","pinyin":"Zài lái yì wǎn mǐ fàn.","en":"One more bowl of rice.","usage":"Use it when you finish a bowl — 再来 = one more.","group":"cafe","key":"d012"},{"zh":"请给我一杯水。","pinyin":"Qǐng gěi wǒ yì bēi shuǐ.","en":"Please give me a glass of water.","usage":"Restaurants often serve hot water by default.","group":"cafe","key":"d013"},{"zh":"买单，谢谢。","pinyin":"Mǎi dān, xiè xie.","en":"Check, please.","usage":"Just call out 买单 (mǎi dān) after eating.","group":"cafe","key":"d014"},{"zh":"可以分开付吗？","pinyin":"Kě yǐ fēn kāi fù ma?","en":"Can we pay separately?","usage":"Use it when splitting the bill with friends.","group":"cafe","key":"d015"},{"zh":"一共多少钱？","pinyin":"Yí gòng duō shao qián?","en":"How much in total?","usage":"一共 = in total. Very common at checkout.","group":"cafe","key":"d016"},{"zh":"师傅，我去樟宜机场，赶时间。","pinyin":"Shī fu, wǒ qù Zhāng yí jī chǎng, gǎn shí jiān.","en":"Driver, to Changi Airport — I'm in a hurry.","usage":"师傅 (shī fu) is the polite way to address any driver. 赶时间 = in a hurry.","group":"transit","key":"d017"},{"zh":"请带我去这个地址。","pinyin":"Qǐng dài wǒ qù zhè ge dì zhǐ.","en":"Please take me to this address.","usage":"Show this on your phone to the taxi driver.","group":"transit","key":"d018"},{"zh":"麻烦在前面路口停一下。","pinyin":"Má fan zài qián miàn lù kǒu tíng yí xià.","en":"Please stop at the intersection ahead.","usage":"路口 = intersection. 停一下 = stop for a moment.","group":"transit","key":"d019"},{"zh":"大概要多久到？","pinyin":"Dà gài yào duō jiǔ dào?","en":"About how long until we arrive?","usage":"大概 = roughly. 多久 = how long. Works for taxis, trains, deliveries.","group":"transit","key":"d020"},{"zh":"可以帮我开一下空调吗？","pinyin":"Kě yǐ bāng wǒ kāi yí xià kōng tiáo ma?","en":"Could you turn on the AC?","usage":"空调 = air conditioning. 开一下 = turn on for a bit.","group":"transit","key":"d021"},{"zh":"到了请叫我一下。","pinyin":"Dào le qǐng jiào wǒ yí xià.","en":"Please tell me when we arrive.","usage":"Say this when you're afraid of missing your stop.","group":"transit","key":"d022"},{"zh":"我到了，在门口等你。","pinyin":"Wǒ dào le, zài mén kǒu děng nǐ.","en":"I've arrived — waiting at the entrance.","usage":"The standard text you send to your driver, date, or friend.","group":"transit","key":"d023"},{"zh":"这趟车到机场吗？","pinyin":"Zhè tàng chē dào jī chǎng ma?","en":"Does this bus/train go to the airport?","usage":"Ask the driver before boarding — 趟 = measure word for trips.","group":"transit","key":"d024"},{"zh":"在哪里买票？","pinyin":"Zài nǎ lǐ mǎi piào?","en":"Where can I buy a ticket?","usage":"Use it for subway, train, plane, or movies.","group":"transit","key":"d025"},{"zh":"一张票，谢谢。","pinyin":"Yì zhāng piào, xiè xie.","en":"One ticket, please.","usage":"张 is the measure word for tickets.","group":"transit","key":"d026"},{"zh":"我迷路了。","pinyin":"Wǒ mí lù le.","en":"I'm lost.","usage":"Say this directly if you're lost — 迷路 = to get lost.","group":"transit","key":"d027"},{"zh":"离这里远吗？","pinyin":"Lí zhè lǐ yuǎn ma?","en":"Is it far from here?","usage":"Ask about distance before you start walking.","group":"transit","key":"d028"},{"zh":"走路十分钟。","pinyin":"Zǒu lù shí fēn zhōng.","en":"Ten minutes on foot.","usage":"Common answer when someone tells you a distance.","group":"transit","key":"d029"},{"zh":"请问，地铁站在哪里？","pinyin":"Qǐng wèn, dì tiě zhàn zài nǎ lǐ?","en":"Excuse me, where is the subway station?","usage":"In China it's 地铁; in Singapore it's MRT.","group":"transit","key":"d030"},{"zh":"请问，洗手间在哪里？","pinyin":"Qǐng wèn, xǐ shǒu jiān zài nǎ lǐ?","en":"Excuse me, where is the restroom?","usage":"Works for asking about toilets anywhere.","group":"transit","key":"d031"},{"zh":"一直走，然后左转。","pinyin":"Yì zhí zǒu, rán hòu zuǒ zhuǎn.","en":"Go straight, then turn left.","usage":"The most common direction pattern — 一直走 + 左/右转.","group":"transit","key":"d032"},{"zh":"可以用微信支付吗？","pinyin":"Kě yǐ yòng Wēi xìn zhī fù ma?","en":"Can I use WeChat Pay?","usage":"微信支付 is accepted almost everywhere in mainland China.","group":"payment","key":"d033"},{"zh":"支付宝也可以吧？","pinyin":"Zhī fù bǎo yě kě yǐ ba?","en":"Alipay works too, right?","usage":"吧 makes it a soft confirmation — you already expect yes.","group":"payment","key":"d034"},{"zh":"我扫你还是你扫我？","pinyin":"Wǒ sǎo nǐ hái shì nǐ sǎo wǒ?","en":"Do I scan you or do you scan me?","usage":"The most useful payment sentence in China. 还是 = or (in questions).","group":"payment","key":"d035"},{"zh":"扫这个二维码付款就行。","pinyin":"Sǎo zhè ge èr wéi mǎ fù kuǎn jiù xíng.","en":"Just scan this QR code to pay.","usage":"二维码 = QR code. 就行 = that's all you need to do.","group":"payment","key":"d036"},{"zh":"付款失败了，我再试一次。","pinyin":"Fù kuǎn shī bài le, wǒ zài shì yí cì.","en":"Payment failed — let me try again.","usage":"失败 = failed. 再试一次 = try one more time.","group":"payment","key":"d037"},{"zh":"零钱不够，我换张卡。","pinyin":"Líng qián bú gòu, wǒ huàn zhāng kǎ.","en":"Not enough balance — I'll switch cards.","usage":"零钱 = balance / change. 换 = change / switch.","group":"payment","key":"d038"},{"zh":"收据可以发我邮箱吗？","pinyin":"Shōu jù kě yǐ fā wǒ yóu xiāng ma?","en":"Can you email me the receipt?","usage":"收据 = receipt. 邮箱 = email inbox. Essential for business trips.","group":"payment","key":"d039"},{"zh":"可以刷卡吗？","pinyin":"Kě yǐ shuā kǎ ma?","en":"Can I pay by card?","usage":"Many places in China now prefer mobile payment over cards.","group":"payment","key":"d040"},{"zh":"可以用现金吗？","pinyin":"Kě yǐ yòng xiàn jīn ma?","en":"Can I use cash?","usage":"Cash is still legal tender, though less common.","group":"payment","key":"d041"},{"zh":"我付现金。","pinyin":"Wǒ fù xiàn jīn.","en":"I'll pay in cash.","usage":"Use it when the QR scanner is down.","group":"payment","key":"d042"},{"zh":"PayNow 可以吗？","pinyin":"PayNow kě yǐ ma?","en":"Can I use PayNow?","usage":"Singapore's local transfer system — works at many hawker stalls.","group":"payment","key":"d043"},{"zh":"你好，我叫……你叫什么？","pinyin":"Nǐ hǎo, wǒ jiào…… nǐ jiào shén me?","en":"Hi, I'm… what's your name?","usage":"The simplest, most natural opener. 叫 = to be called.","group":"social","key":"d044"},{"zh":"你是哪里人？","pinyin":"Nǐ shì nǎ lǐ rén?","en":"Where are you from?","usage":"Literally 'you are where person?' — the standard small-talk question.","group":"social","key":"d045"},{"zh":"加个微信吧？","pinyin":"Jiā ge Wēi xìn ba?","en":"Let's add each other on WeChat?","usage":"In China, this is the real 'can I get your number?' moment.","group":"social","key":"d046"},{"zh":"有空一起吃饭吧。","pinyin":"Yǒu kòng yì qǐ chī fàn ba.","en":"Let's grab a meal when you're free.","usage":"有空 = when free. 一起 = together. The friendliest invitation.","group":"social","key":"d047"},{"zh":"很高兴认识你。","pinyin":"Hěn gāo xìng rèn shi nǐ.","en":"Nice to meet you.","usage":"Works in every setting, from networking events to dinner parties.","group":"social","key":"d048"},{"zh":"下次见，保持联系。","pinyin":"Xià cì jiàn, bǎo chí lián xì.","en":"See you next time — keep in touch.","usage":"The perfect exit line. 保持联系 = keep in touch.","group":"social","key":"d049"},{"zh":"你做什么工作？","pinyin":"Nǐ zuò shén me gōng zuò?","en":"What do you do?","usage":"Very common in introductions — ask it back to keep the chat going.","group":"social","key":"d050"},{"zh":"你学什么？","pinyin":"Nǐ xué shén me?","en":"What do you study?","usage":"Short for 你学什么专业? — great for students.","group":"social","key":"d051"},{"zh":"我请你吃饭。","pinyin":"Wǒ qǐng nǐ chī fàn.","en":"I'll treat you to a meal.","usage":"A common way to show friendship — 请 = to treat.","group":"social","key":"d052"},{"zh":"我们改天吧。","pinyin":"Wǒ men gǎi tiān ba.","en":"Let's do it another day.","usage":"A polite way to cancel without saying 'no.'","group":"social","key":"d053"},{"zh":"你今天忙吗？","pinyin":"Nǐ jīn tiān máng ma?","en":"Are you busy today?","usage":"Use it before asking for a favor or inviting someone out.","group":"social","key":"d054"},{"zh":"你什么时候有空？","pinyin":"Nǐ shén me shí hou yǒu kòng?","en":"When are you free?","usage":"A very useful question when making plans.","group":"social","key":"d055"},{"zh":"我们几点见面？","pinyin":"Wǒ men jǐ diǎn jiàn miàn?","en":"What time shall we meet?","usage":"The standard question for setting a time.","group":"social","key":"d056"},{"zh":"七点可以吗？","pinyin":"Qī diǎn kě yǐ ma?","en":"Is seven okay?","usage":"Replace 七点 with any time — a flexible confirmation.","group":"social","key":"d057"},{"zh":"我马上到。","pinyin":"Wǒ mǎ shàng dào.","en":"I'll be right there.","usage":"Use this when you're almost at the meeting place.","group":"social","key":"d058"},{"zh":"我在门口等你。","pinyin":"Wǒ zài mén kǒu děng nǐ.","en":"I'm waiting for you at the entrance.","usage":"A very common sentence when meeting up.","group":"social","key":"d059"},{"zh":"谢谢你的帮助。","pinyin":"Xiè xie nǐ de bāng zhù.","en":"Thanks for your help.","usage":"More specific than just 谢谢 — shows genuine gratitude.","group":"essential","key":"d060"},{"zh":"不客气，应该的。","pinyin":"Bú kè qi, yīng gāi de.","en":"You're welcome, it's what I should do.","usage":"A very authentic Chinese reply to 谢谢.","group":"essential","key":"d061"},{"zh":"对不起，我迟到了。","pinyin":"Duì bu qǐ, wǒ chí dào le.","en":"Sorry, I'm late.","usage":"First say 对不起, then give the reason.","group":"essential","key":"d062"},{"zh":"没关系，我也刚到。","pinyin":"Méi guān xi, wǒ yě gāng dào.","en":"It's okay, I just arrived too.","usage":"The standard reply to an apology — very forgiving.","group":"essential","key":"d063"},{"zh":"不好意思，打扰一下。","pinyin":"Bù hǎo yì si, dǎ rǎo yí xià.","en":"Excuse me, let me interrupt for a moment.","usage":"Good for interrupting or jumping into a conversation.","group":"essential","key":"d064"},{"zh":"麻烦你了。","pinyin":"Má fan nǐ le.","en":"Sorry to trouble you.","usage":"Said before or after asking for help — extremely polite.","group":"essential","key":"d065"},{"zh":"请说慢一点。","pinyin":"Qǐng shuō màn yì diǎn.","en":"Please speak more slowly.","usage":"Use it when the other person speaks too fast.","group":"essential","key":"d066"},{"zh":"我听不懂。","pinyin":"Wǒ tīng bù dǒng.","en":"I don't understand.","usage":"The most important sentence for beginners.","group":"essential","key":"d067"},{"zh":"这个用中文怎么说？","pinyin":"Zhè ge yòng Zhōng wén zěn me shuō?","en":"How do you say this in Chinese?","usage":"One of the most useful sentences for learning.","group":"essential","key":"d068"},{"zh":"什么意思？","pinyin":"Shén me yì si?","en":"What does it mean?","usage":"Use it when you hear a word you don't know.","group":"essential","key":"d069"},{"zh":"请再说一遍。","pinyin":"Qǐng zài shuō yí biàn.","en":"Please say it again.","usage":"More polite than 什么? — use it when you didn't catch it.","group":"essential","key":"d070"},{"zh":"请写下来。","pinyin":"Qǐng xiě xià lái.","en":"Please write it down.","usage":"Ask them to write it out so you can translate.","group":"essential","key":"d071"},{"zh":"我会说一点中文。","pinyin":"Wǒ huì shuō yì diǎn Zhōng wén.","en":"I can speak a little Chinese.","usage":"A great opening disclaimer — sets expectations.","group":"essential","key":"d072"},{"zh":"我的中文不好。","pinyin":"Wǒ de Zhōng wén bù hǎo.","en":"My Chinese is not good.","usage":"A humble sentence that often makes people speak slower.","group":"essential","key":"d073"},{"zh":"谢谢你的耐心。","pinyin":"Xiè xie nǐ de nài xīn.","en":"Thanks for your patience.","usage":"Say this after someone explains slowly to you.","group":"essential","key":"d074"},{"zh":"我早上七点半起床，洗漱后按时去上班。","pinyin":"Wǒ zǎoshang qī diǎn bàn qǐchuáng, xǐshuò hòu ànshí qù shàngbān.","en":"I got up at 7:30 in the morning, washed up, and went to work on time.","usage":"场景：早起上班","group":"scene","key":"d075"},{"zh":"我在地铁站等车，顺便看了一下手机里的邮件。","pinyin":"Wǒ zài dìtiě zhàn děng chē, shùnbiàn kàn le yíxià shǒujī lǐ de yóujiàn.","en":"I was waiting for the subway at the station and checked my email on my phone.","usage":"场景：通勤路上","group":"scene","key":"d076"},{"zh":"你能不能帮我确认一下会议时间？我可能会晚一点。","pinyin":"Nǐ néng bu néng bāng wǒ quèrèn yíxià huìyì shíjiān? Wǒ kěnéng huì wǎn yìdiǎn.","en":"Could you help me confirm the meeting time? I may be a little late.","usage":"场景：确认会议","group":"scene","key":"d077"},{"zh":"我想请一天假，去医院看一下身体，不方便和大家说太多。","pinyin":"Wǒ xiǎng qǐng yì tiān jià, qù yīyuàn kàn yíxià shēntǐ, bù fāngbiàn hé dàjiā shuō tài duō.","en":"I would like to take one day off to go to the hospital and check my health. It is inconvenient to explain too much to everyone.","usage":"场景：请假","group":"scene","key":"d078"},{"zh":"我去超市买了蔬菜、牛奶和面包，顺便买了洗发水。","pinyin":"Wǒ qù chāoshì mǎi le shūcài, niúnǎi hé miànbāo, shùnbiàn mǎi le xǐfàshuǐ.","en":"I went to the supermarket and bought vegetables, milk, and bread, and also picked up shampoo.","usage":"场景：买菜","group":"scene","key":"d079"},{"zh":"这个周末我们想点外卖，先看看菜单，选一个不太辣的。","pinyin":"Zhège zhōumò wǒmen xiǎng diǎn wàimài, xiān kàn kàn càidān, xuǎn yí gè bù tài là de.","en":"This weekend we want to order takeout, so first we will look at the menu and choose something not too spicy.","usage":"场景：订餐","group":"scene","key":"d080"},{"zh":"医生说我最近睡眠不好，建议我规律作息，少熬夜。","pinyin":"Yīshēng shuō wǒ zuìjìn shuìmián bù hǎo, jiànyì wǒ guīlǜ zuòxī, shǎo áo yè.","en":"The doctor said I have been sleeping poorly recently and suggested that I keep a regular schedule and stay up less late.","usage":"场景：健康建议","group":"scene","key":"d081"},{"zh":"你明天有空吗？我想请你一起吃饭，聊聊工作和生活。","pinyin":"Nǐ míngtiān yǒu kòng ma? Wǒ xiǎng qǐng nǐ yìqǐ chīfàn, liáo liáo gōngzuò hé shēnghuó.","en":"Are you free tomorrow? I want to invite you to dinner to talk about work and life.","usage":"场景：约饭","group":"scene","key":"d082"},{"zh":"这份合同我已经看了一遍，明天可以签字。","pinyin":"Zhè fèn hétóng wǒ yǐjīng kàn le yì biàn, míngtiān kěyǐ qiānzì.","en":"I have already read through this contract and can sign it tomorrow.","usage":"场景：合同签字","group":"scene","key":"d083"},{"zh":"这条路怎么走？离地铁站不远，往前走两分钟就到了。","pinyin":"Zhè tiáo lù zěnme zǒu? Lí dìtiě zhàn bù yuǎn, wǎng qián zǒu liǎng fēnzhōng jiù dào le.","en":"How do I get to this road? It is not far from the subway station; just walk forward for two minutes and you will get there.","usage":"场景：问路","group":"scene","key":"d084"},{"zh":"我今天有点累，晚上想早点休息，准备明天继续工作。","pinyin":"Wǒ jīntiān yǒudiǎn lèi, wǎnshang xiǎng zǎo diǎn xiūxi, zhǔnbèi míngtiān jìxù gōngzuò.","en":"I am a little tired today, so I want to rest early tonight and prepare to continue working tomorrow.","usage":"场景：晚上休息","group":"scene","key":"d085"},{"zh":"这个周末我们一起去公园散步，顺便打电话给朋友。","pinyin":"Zhège zhōumò wǒmen yìqǐ qù gōngyuán sànbù, shùnbiàn dǎ diànhuà gěi péngyou.","en":"This weekend we will go for a walk in the park together and call a friend while we are at it.","usage":"场景：周末安排","group":"scene","key":"d086"},{"zh":"我因为交通堵塞，今天会晚十分钟到公司。","pinyin":"Wǒ yīnwèi jiāotōng dǔsāi, jīntiān huì wǎn shí fēnzhōng dào gōngsī.","en":"Because of traffic congestion, I will arrive at the company ten minutes late today.","usage":"场景：迟到说明","group":"scene","key":"d087"},{"zh":"这个星期三上午十点，我们开会讨论项目进度。","pinyin":"Zhè ge xīng qī sān shàng wǔ shí diǎn, wǒ men kāi huì tǎo lùn xiàng mù jìn dù.","en":"We will have a meeting at 10 a.m. on Wednesday to discuss the project progress.","usage":"场景：会议安排","group":"scene","key":"d088"},{"zh":"我觉得这个方案还不错，但需要再调整一下细节。","pinyin":"Wǒ juéde zhège fāng'àn hái búcuò, dàn xūyào zài tiáozhěng yíxià xìjié.","en":"I think this plan is not bad, but we need to adjust the details a bit more.","usage":"场景：提意见","group":"scene","key":"d089"},{"zh":"这次我请客，我们一起去吃日式料理，顺便庆祝一下。","pinyin":"Zhè cì wǒ qǐngkè, wǒmen yìqǐ qù chī rìshì liàolǐ, shùnbiàn qìngzhù yíxià.","en":"This time I’m treating you—let’s go eat Japanese food together and celebrate a bit.","usage":"场景：请客吃饭","group":"scene","key":"d090"},{"zh":"我想预约一位皮肤科医生，明天上午最好可以看。","pinyin":"Wǒ xiǎng yùyuē yí wèi pífūkē yīshēng, míngtiān shàngwǔ zuìhǎo kěyǐ kàn.","en":"I want to make an appointment with a dermatologist; tomorrow morning would be best if possible.","usage":"场景：预约看病","group":"scene","key":"d091"},{"zh":"我今天去超市，顺便买了一些水果和清洁用品。","pinyin":"Wǒ jīntiān qù chāoshì, shùnbiàn mǎi le yìxiē shuǐguǒ hé qīngjié yòngpǐn.","en":"I went to the supermarket today and picked up some fruit and cleaning supplies while I was there.","usage":"场景：逛超市","group":"scene","key":"d092"},{"zh":"我去银行办了银行卡，工作人员说办理很顺利。","pinyin":"Wǒ qù yínháng bàn le yínhángkǎ, gōngzuò rényuán shuō bànlǐ hěn shùnlì.","en":"I went to the bank to apply for a bank card, and the staff said the process went smoothly.","usage":"场景：银行办理","group":"scene","key":"d093"},{"zh":"我想报名一门汉语口语课，周末上课比较方便。","pinyin":"Wǒ xiǎng bàomíng yì mén Hànyǔ kǒuyǔ kè, zhōumò shàngkè bǐjiào fāngbiàn.","en":"I want to enroll in a Mandarin speaking course; weekend classes are more convenient.","usage":"场景：课程报名","group":"scene","key":"d094"},{"zh":"最近这几天天气有点变化，早晚温差比较大。","pinyin":"Zuìjìn zhè jǐ tiān tiānqì yǒudiǎn biànhuà, zǎowǎn wēnchā bǐjiào dà.","en":"The weather has changed a bit these last few days; the temperature difference between morning and night is quite large.","usage":"场景：聊天气候","group":"scene","key":"d095"},{"zh":"周末我们准备去海边散步，顺便拍一些照片。","pinyin":"Zhōumò wǒmen zhǔnbèi qù hǎibiān sànbù, shùnbiàn pāi yìxiē zhàopiàn.","en":"This weekend we plan to walk by the seaside and take some photos while we are there.","usage":"场景：周末出行","group":"scene","key":"d096"},{"zh":"我和邻居打招呼，说明今天晚上会有点吵，请大家谅解。","pinyin":"Wǒ hé línjū dǎ zhāohu, shuōmíng jīntiān wǎnshang huì yǒudiǎn chǎo, qǐng dàjiā liàngjiě.","en":"I greeted my neighbour and explained that there may be some noise tonight; I hope everyone can understand.","usage":"场景：邻里沟通","group":"scene","key":"d097"},{"zh":"我今天晚上会收拾房间，洗衣服，然后早点休息。","pinyin":"Wǒ jīntiān wǎnshang huì shōushí fángjiān, xǐ yīfu, ránhòu zǎo diǎn xiūxi.","en":"Tonight I will clean the room, do the laundry, and then rest early.","usage":"场景：收拾家务","group":"scene","key":"d098"},{"zh":"我刚刚在地铁上被临时停运困住了，所以会迟到几分钟。","pinyin":"Wǒ gānggāng zài dìtiě shàng bèi línshí tíngyùn kùzhù le, suǒyǐ huì chídào jǐ fēnzhōng.","en":"I was stuck by a temporary subway outage just now, so I will be a few minutes late.","usage":"场景：迟到说明","group":"scene","key":"d099"},{"zh":"我去银行办卡，工作人员告诉我需要先填一份表格。","pinyin":"Wǒ qù yínháng bàn kǎ, gōngzuò rényuán gàosù wǒ xūyào xiān tián yì fèn biǎogé.","en":"I went to the bank to apply for a card, and the staff told me I needed to fill out a form first.","usage":"场景：办理银行","group":"scene","key":"d100"},{"zh":"药店的老板建议我先吃药，再观察两天是否恢复正常。","pinyin":"Yàodiàn de lǎobǎn jiànyì wǒ xiān chī yào, zài guānchá liǎng tiān shìfǒu huīfù zhèngcháng.","en":"The pharmacist suggested that I take my medicine first and then observe for two days to see if I recover normally.","usage":"场景：买药","group":"scene","key":"d101"},{"zh":"我先看一下消息，确认今天晚上能不能一起吃饭。","pinyin":"Wǒ xiān kàn yíxià xiāoxī, quèrèn jīntiān wǎnshang néng bu néng yìqǐ chīfàn.","en":"I’ll check the messages first to confirm whether we can have dinner together tonight.","usage":"场景：看手机","group":"scene","key":"d102"},{"zh":"我们想租一个小办公室，离地铁站近一点比较方便。","pinyin":"Wǒmen xiǎng zū yí gè xiǎo bàngōngshì, lí dìtiě zhàn jìn yìdiǎn bǐjiào fāngbiàn.","en":"We want to rent a small office; it is more convenient if it is a little closer to the subway station.","usage":"场景：场地租赁","group":"scene","key":"d103"},{"zh":"我的手机屏幕裂了，我得马上去维修店修一下。","pinyin":"Wǒ de shǒujī píngmù liè le, wǒ děi mǎshàng qù wéixiū diàn xiū yíxià.","en":"My phone screen cracked, so I need to go to the repair shop immediately.","usage":"场景：紧急修理","group":"scene","key":"d104"},{"zh":"我最近想开始健身，每周三次比较稳定，身体也更有精神。","pinyin":"Wǒ zuìjìn xiǎng kāishǐ jiànshēn, měi zhōu sān cì bǐjiào wěndìng, shēntǐ yě gèng yǒu jīngshén.","en":"I want to start exercising recently; three times a week is more stable and keeps me feeling more energetic.","usage":"场景：健身计划","group":"scene","key":"d105"},{"zh":"我们这周末会在公园附近聚会，大家一起带点零食。","pinyin":"Wǒmen zhè zhōumò huì zài gōngyuán fùjìn jùhuì, dàjiā yìqǐ dài diǎn língshí.","en":"We will have a gathering near the park this weekend, and everyone will bring some snacks together.","usage":"场景：朋友聚会","group":"scene","key":"d106"},{"zh":"我明天准备去新加坡旅行，需要提前买好机票和行李箱。","pinyin":"Wǒ míngtiān zhǔnbèi qù Xīnjiābō lǚxíng, xūyào tíqián mǎi hǎo jīpiào hé xínglǐxiāng.","en":"I am preparing to travel to Singapore tomorrow and need to buy the flight ticket and suitcase in advance.","usage":"场景：旅行准备","group":"scene","key":"d107"},{"zh":"我和家人商量过后，决定这个周末一起去看电影。","pinyin":"Wǒ hé jiārén shāngliàng guò hòu, juédìng zhège zhōumò yìqǐ qù kàn diànyǐng.","en":"After discussing with my family, we decided to go see a movie together this weekend.","usage":"场景：家庭沟通","group":"scene","key":"d108"},{"zh":"我们在商场逛了一圈，决定买一件合适的外套。","pinyin":"Wǒmen zài shāngchǎng guàng le yí quān, juédìng mǎi yí jiàn héshì de wàitào.","en":"We walked around the mall and decided to buy a suitable coat.","usage":"场景：逛街","group":"scene","key":"d109"},{"zh":"今天很忙，但我也终于把所有事情都处理好了，准备休息了。","pinyin":"Jīntiān hěn máng, dàn wǒ yě zhōngyú bǎ suǒyǒu shìqíng dōu chǔlǐ hǎo le, zhǔnbèi xiūxí le.","en":"It was a very busy day, but I finally handled everything and am ready to rest.","usage":"场景：结尾收尾","group":"scene","key":"d110"},{"zh":"今天晚上我来做饭，你负责收拾桌子和洗碗。","pinyin":"Jīntiān wǎnshang wǒ lái zuòfàn, nǐ fùzé shōushí zhuōzi hé xǐwǎn.","en":"I will cook tonight; you are responsible for clearing the table and washing the dishes.","usage":"场景：晚饭安排","group":"scene","key":"d111"},{"zh":"你今天工作太累了，晚上早点回家，别太熬夜。","pinyin":"Nǐ jīntiān gōngzuò tài lèi le, wǎnshang zǎo diǎn huíjiā, bié tài áo yè.","en":"You worked too hard today; go home early tonight and don’t stay up too late.","usage":"场景：关心家人","group":"scene","key":"d112"},{"zh":"这个周末我们一起去超市，然后把家里整理一下。","pinyin":"Zhège zhōumò wǒmen yìqǐ qù chāoshì, ránhòu bǎ jiālǐ zhěnglǐ yíxià.","en":"This weekend we will go to the supermarket together and then tidy the house.","usage":"场景：生活安排","group":"scene","key":"d113"},{"zh":"我们昨天有点生气，但我想把事情说清楚，继续好好相处。","pinyin":"Wǒmen zuótiān yǒudiǎn shēngqì, dàn wǒ xiǎng bǎ shìqing shuō qīngchu, jìxù hǎohǎo xiāngchǔ.","en":"We were a little angry yesterday, but I want to explain things clearly and continue getting along well.","usage":"场景：争吵后和解","group":"scene","key":"d114"},{"zh":"我想订一张明天到新加坡的机票，尽量选靠窗的座位。","pinyin":"Wǒ xiǎng dìng yì zhāng míngtiān dào Xīnjiābō de jīpiào, jǐnliàng xuǎn kàochuāng de zuòwèi.","en":"I want to book a flight to Singapore tomorrow and try to choose a window seat.","usage":"场景：机票预订","group":"scene","key":"d115"},{"zh":"师傅，我想去市中心，能先走高速路吗？","pinyin":"Shīfu, wǒ xiǎng qù shìzhōngxīn, néng xiān zǒu gāosùlù ma?","en":"Driver, I want to go downtown. Can we take the expressway first?","usage":"场景：打车","group":"scene","key":"d116"},{"zh":"您好，我预订了两晚的房间，想问一下是否能提前办理入住。","pinyin":"Nín hǎo, wǒ yùdìng le liǎng wǎn de fángjiān, xiǎng wèn yíxià shìfǒu néng tíqián bànlǐ rùzhù.","en":"Hello, I booked a room for two nights and would like to know if I can check in early.","usage":"场景：入住酒店","group":"scene","key":"d117"},{"zh":"如果你有时间，我推荐去老城区逛一逛，晚上还有灯会。","pinyin":"Rúguǒ nǐ yǒu shíjiān, wǒ tuījiàn qù lǎochéngqū guàng yíguàng, wǎnshang hái yǒu dēnghuì.","en":"If you have time, I recommend visiting the old town and walking around; there is also a lantern festival at night.","usage":"场景：旅游推荐","group":"scene","key":"d118"},{"zh":"我想报名汉语口语课，下周一开始，晚上上课更方便。","pinyin":"Wǒ xiǎng bàomíng Hànyǔ kǒuyǔ kè, xià zhōu yī kāishǐ, wǎnshang shàngkè gèng fāngbiàn.","en":"I want to sign up for a Mandarin speaking class; it starts next Monday and evening classes are more convenient.","usage":"场景：报名课程","group":"scene","key":"d119"},{"zh":"你周末有空吗？我们一起喝咖啡，聊聊最近的工作和生活。","pinyin":"Nǐ zhōumò yǒu kòng ma? Wǒmen yìqǐ hē kāfēi, liáo liáo zuìjìn de gōngzuò hé shēnghuó.","en":"Are you free this weekend? Let’s have coffee together and talk about work and life lately.","usage":"场景：约朋友聊聊","group":"scene","key":"d120"},{"zh":"我想和你交换语言学习，我们轮流用中文和英文交流。","pinyin":"Wǒ xiǎng hé nǐ jiāo huàn yǔ yán xué xí, wǒ men lún liú yòng Zhōng wén hé Yīng wén jiāo liú.","en":"I'd like to practice languages with you. We can take turns speaking Chinese and English.","usage":"场景：语言交换","group":"scene","key":"d121"},{"zh":"老师说今天我们要分组讨论，然后每个人发言两分钟。","pinyin":"Lǎo shī shuō jīn tiān wǒ men yào fēn zǔ tǎo lùn, rán hòu měi ge rén fā yán liǎng fēn zhōng.","en":"The teacher said we'd split into groups today, then each person would speak for two minutes.","usage":"场景：课堂讨论","group":"scene","key":"d122"},{"zh":"我最近总是头晕，想去医院做一下检查，看看是否需要休息。","pinyin":"Wǒ zuìjìn zǒng shì tóu yūn, xiǎng qù yīyuàn zuò yíxià jiǎnchá, kàn kàn shìfǒu xūyào xiūxi.","en":"I have been feeling dizzy lately and want to go to the hospital for a checkup to see whether I need to rest.","usage":"场景：看医生","group":"scene","key":"d123"},{"zh":"药店里有很多种药，我想先问清楚哪一种适合我的情况。","pinyin":"Yàodiàn lǐ yǒu hěn duō zhǒng yào, wǒ xiǎng xiān wèn qīngchu nǎ yì zhǒng shìhé wǒ de qíngkuàng.","en":"There are many kinds of medicine in the pharmacy. I want to ask clearly which one suits my condition first.","usage":"场景：购买药品","group":"scene","key":"d124"},{"zh":"我这次去超市要买米、鸡蛋、牛奶和一些日用品。","pinyin":"Wǒ zhè cì qù chāoshì yào mǎi mǐ, jīdàn, niúnǎi hé yìxiē rìyòngpǐn.","en":"This time I am going to the supermarket to buy rice, eggs, milk, and some daily necessities.","usage":"场景：购物清单","group":"scene","key":"d125"},{"zh":"我先列一个本月的消费清单，再看看哪些开支可以减少。","pinyin":"Wǒ xiān liè yí gè běn yuè de xiāofèi qīngdān, zài kàn kàn nǎxiē kāizhī kěyǐ jiǎnshǎo.","en":"I will make a budget list for this month first and see which expenses can be reduced.","usage":"场景：预算消费","group":"scene","key":"d126"},{"zh":"早上我看到邻居在门口晒衣服，顺便打个招呼聊聊天。","pinyin":"Zǎoshang wǒ kàn dào línjū zài ménkǒu shài yīfu, shùnbiàn dǎ gè zhāohu liáo liáotiān.","en":"I saw my neighbor hanging clothes outside in the morning and greeted them while chatting for a bit.","usage":"场景：邻里问候","group":"scene","key":"d127"},{"zh":"这个周末社区有一场读书分享会，你愿意一起去听一下吗？","pinyin":"Zhège zhōumò shèqiú yǒu yì chǎng dúshū fēnxiǎnghuì, nǐ yuànyì yìqǐ qù tīng yíxià ma?","en":"There is a community book-sharing event this weekend. Are you willing to go together and listen?","usage":"场景：社区活动","group":"scene","key":"d128"},{"zh":"我今天晚上需要临时帮朋友照看孩子，可能会晚一点回家。","pinyin":"Wǒ jīntiān wǎnshang xūyào línshí bāng péngyou zhàokàn háizi, kěnéng huì wǎn yìdiǎn huíjiā.","en":"I need to help a friend watch their child temporarily tonight, so I may get home a little later.","usage":"场景：帮忙照顾","group":"scene","key":"d129"},{"zh":"我想反映一下小区停车问题，麻烦物业尽快处理。","pinyin":"Wǒ xiǎng fǎnyìng yíxià xiǎoqū tíchéng wèntí, máfan wùyè jǐnkuài chǔlǐ.","en":"I would like to raise an issue about parking in the community and ask the property management to deal with it promptly.","usage":"场景：社区投诉","group":"scene","key":"d130"}]}</script>

  });

  /* 会话级探测：只在确认 Edge 可用后才走 Edge，避免点击后长时间无声音 */
  function probeEdge() {
    if (edgeState !== 'unknown') return;
    var myProbe = ++edgeProbeSeq;
    edgeTTS('\u597d', '+0%', 3000).then(function (res) {
      if (myProbe !== edgeProbeSeq) return;
      try { URL.revokeObjectURL(res.url); } catch (e) {}
      edgeState = 'ok';
    })['catch'](function () { if (myProbe === edgeProbeSeq) edgeState = 'dead'; });
  }
  setTimeout(probeEdge, 800);

  function ttsHint(msg) {
    try {
      var el = document.createElement('div');
      el.textContent = '\uD83D\uDD07 ' + msg;
      el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;'
        + 'max-width:min(92vw,460px);padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.5;'
        + 'background:rgba(28,25,23,.94);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);';
      document.body.appendChild(el);
      setTimeout(function () { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 5200);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 5800);
    } catch (e) {}
  }

  function stopPlayback() {
    playing = false;
    if (curAudio) { try { curAudio.pause(); curAudio.currentTime = 0; } catch (e) {} curAudio = null; }
    if (synth) { try { synth.cancel(); } catch (e) {} }
    if (hlRaf) { cancelAnimationFrame(hlRaf); hlRaf = 0; }
    hlOn = false;
    clearHL();
    setPlayingUI(false);
  }

  /* ---------- 预生成的 Edge TTS 音频（晓晓 Xiaoxiao） ----------
     音色统一、离线可用，且带 WordBoundary 时间轴，高亮精确到毫秒 */
  var AUDIO_DIR = 'audio/daily/';
  var audioEls = {}, audioOrder = [], audioMiss = {}, audioFails = 0, audioOk = true;

  function audioUrl(key, sp) { return AUDIO_DIR + key + (sp === 'slow' ? '_slow.mp3' : '.mp3'); }

  function getAudio(key, sp) {
    var k = key + '|' + sp;
    if (!audioEls[k]) {
      var a = new Audio(audioUrl(key, sp));
      a.preload = 'auto';
      audioEls[k] = a; audioOrder.push(k);
      if (audioOrder.length > 80) delete audioEls[audioOrder.shift()];
    }
    return audioEls[k];
  }

  function marksFor(key, sp) {
    var tl = EC_TIMELINE[key];
    if (!tl) return null;
    return sp === 'slow' ? (tl.s || null) : (tl.n || null);
  }

  function preloadCard(s) {
    if (!s || !s.key || !audioOk) return;
    getAudio(s.key, 'normal'); getAudio(s.key, 'slow');
  }

  function playFile(s, sp, my) {
    var a = getAudio(s.key, sp);
    var marks = marksFor(s.key, sp);
    var nH = tokens ? tokens.nH : 1;
    var state = 0;
    curAudio = a;

    var to = setTimeout(function () { if (state === 0 && my === seq) fail(); }, 4500);

    function fail() {
      clearTimeout(to);
      if (my !== seq) return;
      state = 2;
      curAudio = null;
      audioMiss[s.key + '|' + sp] = 1;
      if (++audioFails >= 3) audioOk = false;
      if (hlRaf) { cancelAnimationFrame(hlRaf); hlRaf = 0; }
      try { a.pause(); } catch (e) {}
      speakNow(s, sp, my);
    }

    a.onended = function () {
      clearTimeout(to);
      if (my !== seq) return;
      if (hlRaf) { cancelAnimationFrame(hlRaf); hlRaf = 0; }
      stopPlayback();
    };
    a.onerror = function () { if (state !== 1) fail(); };
    a.onplaying = function () { state = 1; clearTimeout(to); };

    try { a.currentTime = 0; } catch (e) {}
    var pr = a.play();
    if (pr && pr['catch']) pr['catch'](function () { if (state !== 1) fail(); });

    if (marks && marks.length) {
      (function step() {
        if (my !== seq || !playing) return;
        var t = a.currentTime * 1000, h = -1;
        for (var i = 0; i < marks.length; i++) { if (marks[i] <= t) h = i; else break; }
        if (h >= 0) hlAt(Math.min(h, nH - 1));
        hlRaf = requestAnimationFrame(step);
      })();
    } else {
      setTimeout(function () {
        if (my === seq && playing && state === 1) estimate(nH, dur(nH, sp));
      }, 120);
    }
  }

  /* 本地语音：同步进入用户手势，点击即出声 */
  function speakNow(s, speed, my) {
    if (my !== seq) return;
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { setPlayingUI(false); playing = false; return; }
    var u = new SpeechSynthesisUtterance(s.zh);
    u.lang = 'zh-CN';
    u.rate = SPEEDS[speed].rate;
    u.pitch = 1;
    u.volume = 1;
    if (zhVoice) u.voice = zhVoice;
    var gotB = false, started = false;
    u.onstart = function () { started = true; };
    u.onboundary = function (e) {
      if (e.charIndex == null) return;
      gotB = true;
      if (hlRaf) { cancelAnimationFrame(hlRaf); hlRaf = 0; }
      hlOn = false;
      hlAt(tokens ? tokens.mapPos(e.charIndex) : 0);
    };
    u.onend = u.onerror = function () { if (my === seq) stopPlayback(); };

    var doSpeak = function () {
      try { synth.cancel(); } catch (e) {}
      try { synth.speak(u); } catch (e) { playing = false; setPlayingUI(false); }
    };
    /* Chrome 在 cancel() 后立即 speak 偶发静默，队列非空时让出一帧 */
    if (synth.speaking || synth.pending) setTimeout(doSpeak, 80);
    else doSpeak();

    var nH = tokens ? tokens.nH : 1;
    setTimeout(function () {
      if (!gotB && my === seq && playing) estimate(nH, dur(nH, speed));
    }, 200);
    /* 1.5s 还没开口 = 这台设备没有可用的中文语音 */
    setTimeout(function () {
      if (started || my !== seq || ttsWarned) return;
      ttsWarned = true;
      ttsHint(zhVoice ? 'No audio output - check your device volume.' : 'No Chinese voice found. Install a zh-CN voice (or open in Edge) for audio.');
    }, 1500);
  }

  function play(speed) {
    var s = list[idx];
    if (!s) return;
    if (speed && SPEEDS[speed]) { curSpeed = speed; setSpeedUI(); }
    var my = ++seq;
    stopPlayback();
    playing = true;
    hlLast = -1;
    setPlayingUI(true);

    /* 预生成音频最优先：音色统一 + 离线 + 时间轴高亮
       （文件播放本身就在用户手势内，无需再静音预热） */
    if (audioOk && s.key && marksFor(s.key, curSpeed) && !audioMiss[s.key + '|' + curSpeed]) {
      playFile(s, curSpeed, my);
      return;
    }
    primeAudio();

    /* Edge 未确认可用时用本地语音立刻出声，后台再探测一次 */
    if (edgeState !== 'ok') { speakNow(s, curSpeed, my); probeEdge(); return; }

    var key = s.zh + '|' + curSpeed;
    var hit = cache[key];
    if (hit) { go(hit); return; }
    edgeTTS(s.zh, SPEEDS[curSpeed].ssml).then(function (res) {
      if (my !== seq) return;
      cache[key] = res; cacheKeys.push(key);
      if (cacheKeys.length > 60) {
        var old = cacheKeys.shift();
        if (cache[old] && cache[old].url) { try { URL.revokeObjectURL(cache[old].url); } catch (e) {} }
        delete cache[old];
      }
      go(res);
    })['catch'](function () { edgeState = 'dead'; speakNow(s, curSpeed, my); });

    function go(res) {
      if (my !== seq) return;
      primeAudio();
      var a = new Audio(res.url);
      curAudio = a;
      a.volume = 1;
      a.onended = function () { stopPlayback(); };
      a.onerror = function () { stopPlayback(); edgeState = 'dead'; speakNow(s, curSpeed, my); };
      var pr = a.play();
      if (pr && pr.catch) pr.catch(function () { stopPlayback(); speakNow(s, curSpeed, my); });

      var marks = (res.marks || []).map(function (m) {
        return { t: m.t, h: tokens ? tokens.mapPos(m.pos) : 0 };
      }).sort(function (x, y) { return x.t - y.t; });

      if (marks.length) {
        hlOn = true;
        (function step() {
          if (!hlOn || !curAudio) return;
          var t = curAudio.currentTime, j = -1;
          for (var i = 0; i < marks.length; i++) { if (marks[i].t <= t + 0.03) j = i; else break; }
          if (j >= 0) hlAt(marks[j].h);
          hlRaf = requestAnimationFrame(step);
        })();
      } else {
        estimate(tokens ? tokens.nH : 1, dur(tokens ? tokens.nH : 1, curSpeed));
      }
    }
  }

  function setSpeedUI() {
    ['spNormal', 'spSlow'].forEach(function (id) {
      var b = $(id), on = b.getAttribute('data-speed') === curSpeed;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ============ 8. 渲染 ============ */
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

  function renderCard() {
    var s = list[idx];
    if (!s) {
      $('badge').textContent = '—';
      $('counter').textContent = '0 / 0';
      $('pinyin').innerHTML = '';
      $('hanzi').innerHTML = '';
      $('english').textContent = '这个篇目还没有句子。';
      $('usage').textContent = '';
      tokens = null;
      return;
    }
    tokens = tokenize(s.zh, s.pinyin);
    $('badge').textContent = groupLabel(s.group);
    $('counter').textContent = pad2(idx + 1) + ' / ' + pad2(list.length);
    $('pinyin').innerHTML = tokens.pyHtml;
    $('hanzi').innerHTML = tokens.hzHtml;
    $('english').textContent = s.en || '';
    preloadCard(s);
    $('usage').textContent = s.usage || '';
  }

  function groupLabel(gid) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === gid) return GROUPS[i].label;
    return 'Everyday';
  }

  function renderChips() {
    var html = '';
    GROUPS.forEach(function (g) {
      var n = g.id === 'all' ? ITEMS.length : ITEMS.filter(function (x) { return x.group === g.id; }).length;
      if (!n) return;
      html += '<button class="chip" type="button" data-group="' + g.id + '" aria-selected="' + (g.id === curGroup) + '">' +
        g.icon + ' ' + g.label + '<span class="n">' + n + '</span></button>';
    });
    $('chips').innerHTML = html;
  }

  function applyGroup(gid) {
    if (gid === curGroup) return;
    curGroup = gid;
    stopPlayback();
    list = gid === 'all' ? ITEMS.slice() : ITEMS.filter(function (x) { return x.group === gid; });
    idx = 0;
    renderChips();
    renderCard();
  }

  function step(d) {
    if (!list.length) return;
    stopPlayback();
    idx = (idx + d + list.length) % list.length;
    renderCard();
  }

  /* ============ 9. 事件 ============ */
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.chip') : null;
    if (!b) return;
    applyGroup(b.getAttribute('data-group'));
  });
  $('spNormal').addEventListener('click', function () { play('normal'); });
  $('spSlow').addEventListener('click', function () { play('slow'); });
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });

  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); play(curSpeed); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); play('slow'); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); play('normal'); }
  });

  /* ============ 10. 启动 ============ */
  renderChips();
  list = ITEMS.slice();
  renderCard();
  setSpeedUI();
})();
</script>
</body>
</html>
