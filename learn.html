<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  
  <title>HanLingo · 课程</title>
  
  <meta name="description" content="用真实的句子开始学习中文。支持 HSK 1-9, YCT, BCT, MCT。">
  <meta name="author" content="HanLingo">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" href="/favicon.ico">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --blue: #007AFF;
      --blue-dark: #0066CC;
      --green: #34C759;
      --orange: #FF9500;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px;
      --radius-full: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.5; padding: 0 0 80px 0; min-height: 100vh; }
    .app-container { max-width: 480px; margin: 0 auto; background: var(--surface); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.02); }

    /* 状态栏 */
    .status-bar { background: var(--surface); padding: 8px 20px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    
    /* 头部 */
    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { background: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 700; }
    .logo-text { font-weight: 700; font-size: 1rem; }
    .logo-text .han { color: var(--text); }
    .logo-text .lingo { color: var(--blue); }
    .header-actions { display: flex; gap: 14px; color: var(--text-secondary); font-size: 1rem; align-items: center; }
    .header-actions i { cursor: pointer; transition: 0.2s; }
    .header-actions i:hover { color: var(--blue); }

    /* 内容 */
    .learn-container { padding: 16px 20px 10px 20px; }
    .learn-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; background: var(--bg); padding: 10px; border-radius: var(--radius); }
    .learn-progress .bar { flex: 1; height: 4px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .learn-progress .bar .fill { height: 100%; background: var(--blue); border-radius: 20px; transition: width 0.4s ease; }
    .learn-progress .count { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }

    .sentence-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 32px 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.02); min-height: 400px; display: flex; flex-direction: column; }
    
    .card-number { font-size: 0.7rem; color: var(--text-secondary); font-weight: 600; margin-bottom: 8px; }
    .pinyin-top { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 4px; cursor: pointer; padding: 4px 0; border-radius: 4px; transition: 0.2s; }
    .pinyin-top:hover { color: var(--text); background: var(--bg); }
    
    .chinese { font-size: 2.4rem; font-weight: 700; color: var(--text); letter-spacing: 0.5px; cursor: pointer; padding: 4px 0; border-radius: 8px; transition: 0.2s; }
    .chinese:hover { color: var(--blue); background: var(--bg); }
    
    .translation { font-size: 1rem; color: var(--text); background: var(--bg); padding: 8px 18px; border-radius: var(--radius-full); display: inline-block; margin: 12px 0 14px 0; cursor: pointer; transition: 0.2s; align-self: flex-start; }
    .translation:hover { background: var(--border); }
    
    .audio-row { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px 0; flex-wrap: wrap; }
    .play-btn { background: var(--bg); border: none; color: var(--text); padding: 10px 24px; border-radius: var(--radius-full); font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
    .play-btn:hover { background: var(--border); }
    .play-btn.playing { background: var(--blue); color: white; }

    .word-tooltip { display: none; background: var(--bg); color: var(--text); padding: 16px 20px; border-radius: var(--radius); font-size: 0.85rem; margin: 8px 0 14px 0; box-shadow: 0 4px 16px rgba(0,0,0,0.04); animation: tooltipIn 0.25s ease; position: relative; line-height: 1.8; }
    .word-tooltip.show { display: block; }
    .word-tooltip .close-tip { position: absolute; top: 6px; right: 12px; background: none; border: none; color: var(--text-secondary); font-size: 1.1rem; cursor: pointer; }
    .word-tooltip .highlight { color: var(--blue); font-weight: 600; }
    @keyframes tooltipIn { 0% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 1; transform: translateY(0); } }

    .pillars-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px 0; padding-top: 12px; border-top: 1px dashed var(--border); }
    .pillar-tag { background: var(--bg); padding: 5px 14px; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 500; color: var(--text); cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent; }
    .pillar-tag i { color: var(--blue); font-size: 0.75rem; }
    .pillar-tag:hover { border-color: var(--blue); transform: translateY(-1px); }

    .action-row { display: flex; gap: 10px; margin-top: 6px; }
    .learn-btn { flex: 2; background: var(--blue); border: none; color: white; padding: 12px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .learn-btn:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,122,255,0.2); }
    .learn-btn.done { background: var(--green); }
    .learn-btn.done:hover { background: #2c9e47; }
    .learn-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    
    .save-btn { flex: 0.5; background: transparent; border: 1.5px solid var(--border); border-radius: var(--radius-full); font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; min-width: 48px; }
    .save-btn:hover { background: var(--bg); border-color: var(--blue); }
    .save-btn.saved { border-color: var(--blue); color: var(--blue); }

    .nav-buttons { display: flex; gap: 10px; margin-top: 12px; }
    .nav-btn { flex: 1; padding: 14px; border: 1.5px solid var(--border); background: transparent; border-radius: var(--radius-full); font-weight: 600; font-size: 0.85rem; color: var(--text); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .nav-btn:hover { background: var(--bg); border-color: var(--blue); }
    .nav-btn.primary { background: var(--text); color: white; border-color: var(--text); }
    .nav-btn.primary:hover { background: #2c2c2e; }
    .nav-btn.primary:disabled { opacity: 0.3; cursor: not-allowed; }

    /* 完成状态 */
    .completed-section { display: none; text-align: center; padding: 30px 20px; background: var(--bg); border-radius: var(--radius); }
    .completed-section.show { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
    .completed-section .big-icon { font-size: 4rem; margin-bottom: 12px; }
    .completed-section h2 { font-size: 1.5rem; margin-bottom: 6px; }
    .completed-section .stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; font-size: 0.85rem; }
    .completed-section .stats strong { color: var(--blue); font-size: 1.2rem; }
    .completed-section .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .completed-section .btn-group .btn { padding: 14px 28px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; border: none; display: inline-flex; align-items: center; gap: 10px; }
    .completed-section .btn-group .btn-primary { background: var(--blue); color: white; }
    .completed-section .btn-group .btn-primary:hover { background: var(--blue-dark); }
    .completed-section .btn-group .btn-success { background: var(--green); color: white; }

    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(29,29,31,0.9); backdrop-filter: blur(12px); color: white; padding: 12px 24px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.2); opacity: 0; transition: all 0.3s ease; z-index: 200; max-width: 90%; text-align: center; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast i { margin-right: 8px; color: #5AC8FA; }

    /* 底部导航 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px 0; max-width: 480px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 0.55rem; font-weight: 500; gap: 1px; cursor: pointer; padding: 4px 12px; border-radius: 20px; transition: 0.1s; position: relative; }
    .nav-item i { font-size: 1.3rem; color: var(--text-secondary); }
    .nav-item.active i { color: var(--blue); }
    .nav-item.active { color: var(--text); }

    @media (max-width: 400px) { .chinese { font-size: 2rem; } .sentence-card { padding: 24px 16px; } }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>HanLingo</span>
      <span>免费课程</span>
    </div>

    <header class="header">
      <div class="logo-area" id="goHomeBtn" title="返回主页">
        <div class="logo-icon">HL</div>
        <div class="logo-text">
          <span class="han">Han</span><span class="lingo">Lingo</span>
        </div>
      </div>
      <div class="header-actions">
        <i class="far fa-bell" title="通知"></i>
        <i class="far fa-user-circle" title="个人中心"></i>
      </div>
    </header>

    <div class="learn-container">
      <div class="learn-progress">
        <span style="font-size:0.7rem; font-weight:600; color:var(--text-secondary);" id="levelLabel">HSK 1</span>
        <div class="bar"><div class="fill" id="progressFill" style="width:0%;"></div></div>
        <span class="count"><span id="currentIdx">1</span>/<span id="totalCount">5</span></span>
      </div>

      <!-- 卡片区域 -->
      <div class="sentence-card" id="sentenceCard">
        <div class="card-number" id="cardNumber">#1 / 5</div>
        <div class="pinyin-top" id="pinyinTop">Nǐ hǎo ma?</div>
        <div class="chinese" id="chineseText">你好吗？</div>
        <div class="translation" id="translationText">你好吗？</div>

        <div class="audio-row">
          <button class="play-btn" id="playBtn"><i class="fas fa-play"></i> 播放</button>
          <span style="font-size:0.7rem; color:var(--text-secondary);">点击文字查看更多</span>
        </div>

        <div class="word-tooltip" id="tooltip">
          <button class="close-tip" id="closeTip">✕</button>
          <div id="tooltipContent">点击文本查看详细信息。</div>
        </div>

        <div class="pillars-row" id="pillarsRow"></div>

        <div class="action-row">
          <button class="learn-btn" id="learnBtn"><i class="fas fa-check"></i> 标记为已学</button>
          <button class="save-btn" id="saveBtn"><i class="far fa-bookmark"></i></button>
        </div>

        <div class="nav-buttons">
          <button class="nav-btn" id="prevBtn"><i class="fas fa-chevron-left"></i> 上一句</button>
          <button class="nav-btn primary" id="nextBtn">下一句 <i class="fas fa-chevron-right"></i></button>
        </div>
      </div>

      <!-- 完成区域 -->
      <div class="completed-section" id="completedSection">
        <div class="big-icon">🎉</div>
        <h2 id="completeTitle">全部完成！</h2>
        <p id="completeDesc">您已学完本组 <strong id="completedCount">5</strong> 个句子！</p>
        <div class="stats">
          <span>🔥 <strong id="streakDisplay">0</strong> 天</span>
          <span>⭐ <strong id="savedDisplay">0</span> 收藏</span>
          <span>✅ <strong id="totalLearnedDisplay">0</span> 总数</span>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="goQuestBtn"><i class="fas fa-flag"></i> 前往闯关</button>
          <button class="btn btn-success" id="nextLevelBtn"><i class="fas fa-arrow-right"></i> 下一级</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
      <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>主页</span></div>
      <div class="nav-item active" data-page="learn"><i class="fas fa-book-open"></i><span>课程</span></div>
      <div class="nav-item" data-page="quest"><i class="fas fa-flag"></i><span>闯关</span></div>
      <div class="nav-item" data-page="saved"><i class="fas fa-bookmark"></i><span>收藏</span></div>
      <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>个人</span></div>
    </div>
  </div>

  <!-- 模拟数据/逻辑脚本 -->
  <script>
    // 模拟数据（实际应引用 data/sentences.js）
    var data = [
      { id: 'hsk1_001', chinese: '你好。', pinyin: 'Nǐ hǎo.', translation: '你好。' },
      { id: 'hsk1_002', chinese: '你好吗？', pinyin: 'Nǐ hǎo ma?', translation: '你好吗？' },
      { id: 'hsk1_003', chinese: '我很好。', pinyin: 'Wǒ hěn hǎo.', translation: '我很好。' },
      { id: 'hsk1_004', chinese: '谢谢。', pinyin: 'Xièxiè.', translation: '谢谢。' },
      { id: 'hsk1_005', chinese: '再见。', pinyin: 'Zàijiàn.', translation: '再见。' }
    ];
    var currentIndex = 0;
    var learned = [];
    
    function renderCard() {
      var s = data[currentIndex];
      document.getElementById('pinyinTop').textContent = s.pinyin;
      document.getElementById('chineseText').textContent = s.chinese;
      document.getElementById('translationText').textContent = s.translation;
      document.getElementById('currentIdx').textContent = currentIndex + 1;
      document.getElementById('totalCount').textContent = data.length;
      document.getElementById('progressFill').style.width = ((currentIndex + 1) / data.length * 100) + '%';
      
      // 按钮禁用/启用逻辑
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === data.length - 1;
    }

    document.getElementById('goHomeBtn').addEventListener('click', function() { window.location.href = 'index.html'; });
    
    document.getElementById('prevBtn').addEventListener('click', function() {
      if (currentIndex > 0) { currentIndex--; renderCard(); }
    });
    
    document.getElementById('nextBtn').addEventListener('click', function() {
      if (currentIndex < data.length - 1) { currentIndex++; renderCard(); }
    });

    document.querySelectorAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var page = this.dataset.page;
        if (page === 'home') window.location.href = 'index.html';
        else if (page === 'learn') { /* 当前页 */ }
        else if (page === 'quest') window.location.href = 'quest.html';
        else if (page === 'profile') window.location.href = 'profile.html';
        else alert(page + ' 页面开发中');
      });
    });

    renderCard();
  </script>
</body>
</html>
