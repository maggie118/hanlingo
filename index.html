<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HanLingo | Learn Mandarin Chinese Through Classic Tales</title>
<meta name="description" content="Learn Mandarin Chinese through classic stories, HSK 3-4 reading practice, and vocabulary cards designed for English-speaking learners.">
<meta name="keywords" content="learn Mandarin Chinese, Mandarin for beginners, HSK 3-4 Chinese reading, Chinese story learning, study Chinese online, Chinese vocabulary app, HanLingo">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta name="author" content="HanLingo">
<meta name="language" content="en">
<link rel="canonical" href="https://hanlingo.app/">

<!-- Open Graph / Social -->
<meta property="og:type" content="website">
<meta property="og:title" content="HanLingo | Learn Mandarin Chinese Through Classic Tales">
<meta property="og:description" content="Read classic Chinese stories, build vocabulary, and improve Mandarin with story-based lessons designed for English-speaking learners.">
<meta property="og:url" content="https://hanlingo.app/">
<meta property="og:image" content="https://hanlingo.app/icons/icon-512.png">
<meta property="og:site_name" content="HanLingo">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="HanLingo | Learn Mandarin Chinese Through Classic Tales">
<meta name="twitter:description" content="Learn Mandarin with classic stories, HSK reading, and vocabulary cards designed for English-speaking learners.">
<meta name="twitter:image" content="https://hanlingo.app/icons/icon-512.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a2724">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HanLingo">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "HanLingo",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Web",
  "description": "HanLingo is a story-based Mandarin learning app for English-speaking learners, featuring HSK 3-4 reading, vocabulary cards, and interactive audio support for studying Chinese online.",
  "url": "https://hanlingo.app/",
  "inLanguage": ["en", "zh"],
  "audience": {
    "@type": "Audience",
    "audienceType": "English-speaking learners of Mandarin Chinese"
  },
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "keywords": "Mandarin Chinese, HSK 3-4, Chinese reading, vocabulary learning, story-based language learning"
}
</script>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<header class="header">
  <div class="wrap">
    <span class="logo"><img class="logo-img" src="icons/logo.jpg" alt="" width="40" height="40">HanLingo</span>
    <label for="hsk" hidden>HSK level</label>
    <select id="hsk" class="hsk">
      <option>HSK 1-2</option>
      <option selected>HSK 3-4</option>
      <option>HSK 5-6</option>
    </select>
    <button id="pro-btn" class="pro-btn" type="button">Pro</button>
  </div>
</header>

<main class="wrap">
  <!-- Learn (home) -->
  <div id="view-learn">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <h1 id="hero-title">Liaozhai Tales</h1>
        <p class="sub">Strange tales from a Chinese studio — retold sentence by sentence for HSK 3-4.</p>
        <ul class="meta">
          <li>HSK 3-4</li>
          <li>8 Stories</li>
          <li>96 Cards</li>
          <li class="free">Card 1-4 Free</li>
        </ul>
        <button class="btn primary" type="button" data-goto="stories">Choose a Story</button>
      </div>
      <div class="hero-title-stack" aria-hidden="true">
        <div class="hero-title-v">聊斋</div>
        <div class="seal">
          <span class="seal-text">志异</span>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Categories">
      <button class="tab" role="tab" aria-selected="true" data-cat="strange">👻 Strange Tales</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="daily">☕ Daily Life</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="business">💼 Business</button>
    </div>

    <h2 id="stories" class="section-title">Choose a story</h2>
    <section id="stream" class="stream"></section>
    <p id="soon" class="empty" hidden>New stories are on the way.</p>
  </div>

  <div id="view-reader" hidden></div>
  <div id="view-vocab" hidden></div>
  <div id="view-profile" hidden></div>
</main>

<!-- Overlays -->
<div id="sheet" class="overlay" hidden></div>
<div id="paywall" class="overlay center" hidden></div>

<nav class="bottom-nav" aria-label="Primary">
  <ul>
    <li><button type="button" data-view="learn" aria-current="page"><span class="ic">📖</span>Learn</button></li>
    <li><button type="button" data-view="vocab"><span class="ic">🔖</span>Vocab</button></li>
    <li><button type="button" data-view="profile"><span class="ic">👤</span>Profile</button></li>
  </ul>
</nav>

<script src="stories-data.js"></script>
<script src="app.js"></script>
<script>
/* Hero button: scroll to the story list instead of opening a story */
document.querySelectorAll('[data-goto]').forEach(function(b){
  b.addEventListener('click', function(){
    var t = document.getElementById(b.dataset.goto);
    if (t) t.scrollIntoView({behavior:'smooth', block:'start'});
  });
});
</script>
</body>
</html>
