<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HanLingo | Learn Mandarin Through Stories & Everyday Chinese</title>
<meta name="description" content="Learn Mandarin through classic stories, practical HSK 1-2 workplace Chinese, and advanced HSK 5-6 daily-life, business, and strategy stories.">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<link rel="canonical" href="https://www.hanlingo.app/">

<!-- Open Graph / Social -->
<meta property="og:type" content="website">
<meta property="og:title" content="HanLingo | Learn Mandarin Through Stories & Everyday Chinese">
<meta property="og:description" content="Learn Mandarin through classic stories, practical HSK 1-2 workplace Chinese, and advanced HSK 5-6 daily-life, business, and strategy stories.">
<meta property="og:url" content="https://www.hanlingo.app/">
<meta property="og:image" content="https://www.hanlingo.app/icons/icon-512.png">
<meta property="og:site_name" content="HanLingo">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="HanLingo | Learn Mandarin Through Stories & Everyday Chinese">
<meta name="twitter:description" content="Learn Mandarin through classic stories, practical HSK 1-2 workplace Chinese, and advanced HSK 5-6 daily-life, business, and strategy stories.">
<meta name="twitter:image" content="https://www.hanlingo.app/icons/icon-512.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a2724">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HanLingo">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "HanLingo",
  "applicationCategory": "EducationalApplication",
  "operatingSystem": "Web",
  "description": "HanLingo helps English-speaking learners study Mandarin through classic stories, practical HSK 1-2 workplace Chinese, and advanced HSK 5-6 daily-life, business, and strategy stories.",
  "url": "https://www.hanlingo.app/",
  "inLanguage": ["en", "zh"],
  "audience": {
    "@type": "Audience",
    "audienceType": "English-speaking learners of Mandarin Chinese"
  },
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<header class="header">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Go to HanLingo home page">
      <img class="logo-img" src="icons/logo.jpg" alt="HanLingo logo" width="40" height="40">HanLingo
    </a>
    <label for="hsk" hidden>HSK level</label>
    <select id="hsk" class="hsk">
      <option>HSK 1-2</option>
      <option selected>HSK 3-4</option>
      <option>HSK 5-6</option>
    </select>
    <button id="pro-btn" class="pro-btn" type="button">Pro</button>
  </div>
</header>

<main class="wrap">
  <!-- Learn (home) -->
  <div id="view-learn">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <h1 id="hero-title">Liaozhai Tales</h1>
        <p class="sub"><strong>Classic ghost stories with atmosphere and texture.</strong><br>Explore the strange, the eerie, and the mythical at a measured pace with story-first Mandarin practice.</p>
        <ul class="meta">
          <li>HSK 1-2</li>
          <li>HSK 3-4</li>
          <li>8 Stories</li>
          <li>96 Cards</li>
          <li class="free">Card 1-4 Free</li>
        </ul>
        <button class="btn primary" type="button" data-goto="stories">Choose a Story</button>
      </div>
      <div class="hero-title-stack" aria-hidden="true">
        <div class="hero-title-v">聊</div>
        <div class="seal">
          <span class="seal-text">斋</span>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Categories">
      <button class="tab" role="tab" aria-selected="true" data-cat="strange">👻 Strange Tales</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="daily">☕ Daily Life</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="business">💼 Business</button>
    </div>

    <h2 id="stories" class="section-title">Choose a story</h2>
    <section id="stream" class="stream"></section>
    <p id="soon" class="empty" hidden>New stories are on the way.</p>
  </div>

  <div id="view-reader" hidden></div>
  <div id="view-vocab" hidden></div>
  <div id="view-profile" hidden></div>
</main>

<!-- Overlays -->
<div id="sheet" class="overlay" hidden></div>
<div id="paywall" class="overlay center" hidden></div>

<nav class="bottom-nav" aria-label="Primary">
  <ul>
    <li><button type="button" data-view="learn" aria-current="page"><span class="ic">📖</span>Learn</button></li>
    <li><button type="button" data-view="vocab"><span class="ic">🔖</span>Vocab</button></li>
    <li><button type="button" data-view="profile"><span class="ic">👤</span>Profile</button></li>
    <li>
      <button type="button" id="install-app" aria-label="Install app">
        <svg class="ic install-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v11"></path>
          <path d="m8 10 4 4 4-4"></path>
          <path d="M5 17v3h14v-3"></path>
        </svg>
        Install app
      </button>
    </li>
  </ul>
</nav>

<script src="stories-data.js"></script>
<script src="daily-life.js"></script>
<script src="business-hsk12.js"></script>
<script src="journey-west-hsk12.js"></script>
<script src="art-of-war-hsk56.js"></script>
<script src="advanced-daily-hsk56.js"></script>
<script src="advanced-business-hsk56.js"></script>
<script src="app.js"></script>
<script>
/* Hero button: scroll to the story list instead of opening a story */
document.querySelectorAll('[data-goto]').forEach(function(b){
  b.addEventListener('click', function(){
    var t = document.getElementById(b.dataset.goto);
    if (t) t.scrollIntoView({behavior:'smooth', block:'start'});
  });
});
</script>
</body>
</html>
