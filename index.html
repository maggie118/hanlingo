<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HanLingo</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a2724">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HanLingo">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="wrap">
    <span class="logo">HanLingo</span>
    <label for="hsk" hidden>HSK level</label>
    <select id="hsk" class="hsk">
      <option>HSK 1-2</option>
      <option selected>HSK 3-4</option>
      <option>HSK 5-6</option>
    </select>
    <button id="pro-btn" class="pro-btn" type="button">Pro</button>
  </div>
</header>

<main class="wrap">
  <!-- Learn (home) -->
  <div id="view-learn">
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <h1 id="hero-title">聊斋志异 · Liaozhai Tales</h1>
        <p class="sub">Strange tales from a Chinese studio — retold sentence by sentence for HSK 3-4.</p>
        <ul class="meta">
          <li>HSK 3-4</li>
          <li>5 Stories</li>
          <li>60 Cards</li>
          <li class="free">Card 1-4 Free</li>
        </ul>
        <button class="btn primary" type="button" data-open="0">Start Reading</button>
      </div>
      <div class="hero-title-v" aria-hidden="true">聊斋</div>
    </section>

    <div class="tabs" role="tablist" aria-label="Categories">
      <button class="tab" role="tab" aria-selected="true" data-cat="strange">👻 Strange Tales</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="daily">☕ Daily Life</button>
      <button class="tab" role="tab" aria-selected="false" data-cat="business">💼 Business</button>
    </div>

    <section id="stream" class="stream"></section>
    <p id="soon" class="empty" hidden>New stories are on the way.</p>
  </div>

  <div id="view-reader" hidden></div>
  <div id="view-vocab" hidden></div>
  <div id="view-profile" hidden></div>
</main>

<!-- Overlays -->
<div id="sheet" class="overlay" hidden></div>
<div id="paywall" class="overlay center" hidden></div>

<nav class="bottom-nav" aria-label="Primary">
  <ul>
    <li><button type="button" data-view="learn" aria-current="page"><span class="ic">📖</span>Learn</button></li>
    <li><button type="button" data-view="vocab"><span class="ic">🔖</span>Vocab</button></li>
    <li><button type="button" data-view="profile"><span class="ic">👤</span>Profile</button></li>
  </ul>
</nav>

<script src="app.js"></script>
</body>
</html>
