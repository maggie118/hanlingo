<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HanLingo · 个人中心</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --blue: #007AFF;
      --blue-dark: #0066CC;
      --green: #34C759;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px;
      --radius-full: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.5; padding: 0 0 80px 0; min-height: 100vh; }
    .app-container { max-width: 480px; margin: 0 auto; background: var(--surface); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.02); }

    .status-bar { background: var(--surface); padding: 8px 20px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    
    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-icon { background: var(--blue); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 700; }
    .logo-text { font-weight: 700; font-size: 1rem; }
    .logo-text .han { color: var(--text); }
    .logo-text .lingo { color: var(--blue); }
    .header-actions { display: flex; gap: 14px; color: var(--text-secondary); font-size: 1rem; align-items: center; }

    .profile-container { padding: 16px 20px 10px 20px; }
    
    .profile-header { background: linear-gradient(135deg, #F0F4FF, #E5EDFF); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 16px; text-align: center; border: 1px solid var(--border); }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--blue); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: white; border: 3px solid white; box-shadow: 0 4px 12px rgba(0,122,255,0.15); }
    .profile-name { font-size: 1.1rem; font-weight: 700; }
    .profile-email { font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--bg); border-radius: var(--radius); padding: 12px 4px; text-align: center; }
    .stat-card .num { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    .stat-card .num.blue { color: var(--blue); }
    .stat-card .num.green { color: var(--green); }
    .stat-card .label { font-size: 0.45rem; color: var(--text-secondary); margin-top: 2px; }

    .section-card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); margin-bottom: 10px; }
    .section-title { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .section-title i { color: var(--blue); font-size: 0.75rem; }

    .progress-item { margin-bottom: 8px; }
    .progress-item .row { display: flex; justify-content: space-between; font-size: 0.55rem; color: var(--text-secondary); margin-bottom: 2px; }
    .progress-item .track { width: 100%; height: 4px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .progress-item .track .fill { height: 100%; background: var(--blue); border-radius: 20px; transition: width 0.8s ease; }
    .progress-item .track .fill.green { background: var(--green); }

    .level-list { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .level-dot { width: 100%; aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.45rem; font-weight: 700; color: white; background: var(--border); transition: 0.2s; }
    .level-dot.done { background: var(--green); }
    .level-dot.current { background: var(--blue); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue); }

    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .settings-row:last-child { border-bottom: none; }
    .settings-row .label { font-size: 0.6rem; font-weight: 500; color: var(--text); }
    .settings-row .label .desc { font-size: 0.45rem; font-weight: 400; color: var(--text-secondary); display: block; }

    .toggle { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; transition: .3s; border-radius: 22px; }
    .toggle .slider::before { position: absolute; content: ''; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
    .toggle input:checked + .slider { background: var(--blue); }
    .toggle input:checked + .slider::before { transform: translateX(18px); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px 0; max-width: 480px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 0.55rem; font-weight: 500; gap: 1px; cursor: pointer; padding: 4px 12px; border-radius: 20px; transition: 0.1s; }
    .nav-item i { font-size: 1.3rem; color: var(--text-secondary); }
    .nav-item.active i { color: var(--blue); }
    .nav-item.active { color: var(--text); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="status-bar">
      <span>HanLingo</span>
      <span>个人中心</span>
    </div>

    <header class="header">
      <div class="logo-area" id="goHomeBtn" title="返回主页">
        <div class="logo-icon">HL</div>
        <div class="logo-text">
          <span class="han">Han</span><span class="lingo">Lingo</span>
        </div>
      </div>
      <div class="header-actions">
        <i class="far fa-bell"></i>
        <i class="fas fa-cog"></i>
      </div>
    </header>

    <div class="profile-container">
      <div class="profile-header">
        <div class="profile-avatar">U</div>
        <div class="profile-name">用户</div>
        <div class="profile-email">user@example.com</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="num blue">12</div><div class="label">已学</div></div>
        <div class="stat-card"><div class="num green">5</div><div class="label">连续</div></div>
        <div class="stat-card"><div class="num">3</div><div class="label">收藏</div></div>
        <div class="stat-card"><div class="num">0</div><div class="label">错题</div></div>
      </div>

      <div class="section-card">
        <div class="section-title"><i class="fas fa-chart-line"></i> 学习进度</div>
        <div class="progress-item"><div class="row"><span>总进度</span><span>40%</span></div><div class="track"><div class="fill" style="width:40%;"></div></div></div>
        <div class="progress-item"><div class="row"><span>当前等级</span><span>Lv.2</span></div><div class="track"><div class="fill green" style="width:60%;"></div></div></div>
      </div>

      <div class="section-card">
        <div class="section-title"><i class="fas fa-layer-group"></i> 等级</div>
        <div class="level-list">
          <div class="level-dot done">✓</div>
          <div class="level-dot current">2</div>
          <div class="level-dot">3</div>
          <div class="level-dot">4</div>
          <div class="level-dot">5</div>
          <div class="level-dot">6</div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-title"><i class="fas fa-sliders-h"></i> 设置</div>
        <div class="settings-row"><div class="label">每日目标<span class="desc">句子数量</span></div><span style="font-weight:600;">5</span></div>
        <div class="settings-row"><div class="label">每日提醒</div><label class="toggle"><input type="checkbox" checked><span class="slider"></span></label></div>
        <div class="settings-row"><div class="label">深色模式</div><label class="toggle"><input type="checkbox"><span class="slider"></span></label></div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item" data-page="home"><i class="fas fa-home"></i><span>主页</span></div>
      <div class="nav-item" data-page="learn"><i class="fas fa-book-open"></i><span>课程</span></div>
      <div class="nav-item" data-page="quest"><i class="fas fa-flag"></i><span>闯关</span></div>
      <div class="nav-item" data-page="saved"><i class="fas fa-bookmark"></i><span>收藏</span></div>
      <div class="nav-item active" data-page="profile"><i class="fas fa-user"></i><span>个人</span></div>
    </div>
  </div>

  <script>
    document.getElementById('goHomeBtn').addEventListener('click', function() { window.location.href = 'index.html'; });
    document.querySelectorAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var page = this.dataset.page;
        if (page === 'home') window.location.href = 'index.html';
        else if (page === 'learn') window.location.href = 'learn.html';
        else if (page === 'quest') window.location.href = 'quest.html';
        else if (page === 'profile') { /* 当前页 */ }
      });
    });
  </script>
</body>
</html>
